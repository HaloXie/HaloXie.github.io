<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><rect width="1440" height="810" fill="#fff9e9"/>
  <title id="title">Three Lanes for Configuration Sync</title>
  <desc id="desc">Classify configuration as plaintext, encrypted, or never stored in the repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9e9"/><stop offset="1" stop-color="#fff9e9"/></linearGradient>
  </defs>
  <rect width="1440" height="760" rx="32" fill="url(#bg)"/>
  <text x="72" y="90" fill="#252525" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="700">Classify Before You Sync</text>
  <text x="72" y="135" fill="#444444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24">Security depends on content and recovery—not the filename.</text>

  <g transform="translate(72 190)">
    <rect width="400" height="480" rx="26" fill="#ffffff" stroke="#315343" stroke-width="2"/>
    <circle cx="52" cy="58" r="22" fill="#2d8758" opacity=".2"/>
    <path d="M40 58l8 8 16-19" fill="none" stroke="#2d8758" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="69" fill="#252525" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="650">Plaintext</text>
    <text x="34" y="116" fill="#252525" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21">Safe for repository readers</text>
    <g fill="#e6f6ff" stroke="#33516a"><rect x="34" y="156" width="150" height="52" rx="14"/><rect x="200" y="156" width="166" height="52" rx="14"/><rect x="34" y="224" width="180" height="52" rx="14"/><rect x="230" y="224" width="136" height="52" rx="14"/><rect x="34" y="292" width="150" height="52" rx="14"/></g>
    <g fill="#253f52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20"><text x="109" y="189" text-anchor="middle">.zshrc</text><text x="283" y="189" text-anchor="middle">Ghostty</text><text x="124" y="257" text-anchor="middle">Hammerspoon</text><text x="298" y="257" text-anchor="middle">Finicky</text><text x="109" y="325" text-anchor="middle">AGENTS.md</text></g>
    <text x="34" y="405" fill="#444444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">Inspect, then add one file at a time</text>
    <text x="34" y="440" fill="#444444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">Never package whole folders</text>
  </g>

  <g transform="translate(520 190)">
    <rect width="400" height="480" rx="26" fill="#ffffff" stroke="#67542e" stroke-width="2"/>
    <path d="M41 54v-8a13 13 0 0126 0v8m-33 0h40v34h-40z" fill="none" stroke="#a97416" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="69" fill="#252525" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="650">Encrypted</text>
    <text x="34" y="116" fill="#252525" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21">Must recover; must never be plaintext</text>
    <g fill="#fff0a5" stroke="#625238"><rect x="34" y="156" width="150" height="52" rx="14"/><rect x="200" y="156" width="166" height="52" rx="14"/><rect x="34" y="224" width="180" height="52" rx="14"/><rect x="230" y="224" width="136" height="52" rx="14"/></g>
    <g fill="#614811" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20"><text x="109" y="189" text-anchor="middle">.pgpass</text><text x="283" y="189" text-anchor="middle">Clash subscription</text><text x="124" y="257" text-anchor="middle">Database cert</text><text x="298" y="257" text-anchor="middle">Private host</text></g>
    <text x="34" y="405" fill="#444444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">Use chezmoi add --encrypt</text>
    <text x="34" y="440" fill="#444444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">Inspect ciphertext headers, never print content</text>
  </g>

  <g transform="translate(968 190)">
    <rect width="400" height="480" rx="26" fill="#ffffff" stroke="#643b46" stroke-width="2"/>
    <circle cx="52" cy="58" r="22" fill="#b84634" opacity=".18"/>
    <path d="M40 46l24 24m0-24L40 70" stroke="#b84634" stroke-width="6" stroke-linecap="round"/>
    <text x="90" y="69" fill="#252525" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="650">Never in Git</text>
    <text x="34" y="116" fill="#b84634" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" style="font-size:18px">Rebuildable, or risk exceeds sync value</text>
    <g fill="#fff0dc" stroke="#69404d"><rect x="34" y="156" width="150" height="52" rx="14"/><rect x="200" y="156" width="166" height="52" rx="14"/><rect x="34" y="224" width="180" height="52" rx="14"/><rect x="230" y="224" width="136" height="52" rx="14"/><rect x="34" y="292" width="180" height="52" rx="14"/></g>
    <g fill="#633a2a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20"><text x="109" y="189" text-anchor="middle">sessions</text><text x="283" y="189" text-anchor="middle">workspaceStorage</text><text x="124" y="257" text-anchor="middle">logs / cache</text><text x="298" y="257" text-anchor="middle">Conda pkgs</text><text x="124" y="325" text-anchor="middle">Device SSH key</text></g>
    <text x="34" y="405" fill="#444444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">Regenerate or sign in on the new device</text>
    <text x="34" y="440" fill="#444444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">Do not disguise runtime state as config</text>
  </g>
</svg>
