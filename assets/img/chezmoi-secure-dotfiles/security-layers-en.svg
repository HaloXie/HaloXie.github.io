<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc"><rect width="1440" height="810" fill="#fff9e9"/>
  <title id="title">Five Defenses Before Plaintext Reaches Git</title>
  <desc id="desc">Five defenses stop secret leakage from file-by-file intake through human review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9e9"/><stop offset="1" stop-color="#fff9e9"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#269ac7"/></marker>
  </defs>
  <rect width="1440" height="720" rx="32" fill="url(#bg)"/>
  <text x="72" y="88" fill="#252525" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="700">Stop Secrets Before the First Commit</text>
  <text x="72" y="134" fill="#444444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24">A private repo is the final access control, not the first safety check.</text>

  <path d="M135 330H1280" stroke="#27415b" stroke-width="6" marker-end="url(#arrow)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(90 220)"><circle cx="85" cy="110" r="76" fill="#e6f6ff" stroke="#269ac7" stroke-width="3"/><text x="85" y="100" text-anchor="middle" fill="#252525" font-size="34" font-weight="700">01</text><text x="85" y="135" text-anchor="middle" fill="#252525" font-size="20" font-weight="600">Add One File</text><text x="85" y="225" text-anchor="middle" fill="#444444" font-size="19">Never whole folders</text></g>
    <g transform="translate(350 220)"><circle cx="85" cy="110" r="76" fill="#fff0a5" stroke="#a97416" stroke-width="3"/><text x="85" y="100" text-anchor="middle" fill="#252525" font-size="34" font-weight="700">02</text><text x="85" y="135" text-anchor="middle" fill="#252525" font-weight="600" style="font-size:17px">age Encryption</text><text x="85" y="225" text-anchor="middle" fill="#444444" font-size="19">No plaintext in Git</text></g>
    <g transform="translate(610 220)"><circle cx="85" cy="110" r="76" fill="#e6f6ff" stroke="#2d8758" stroke-width="3"/><text x="85" y="100" text-anchor="middle" fill="#252525" font-size="34" font-weight="700">03</text><text x="85" y="135" text-anchor="middle" fill="#252525" font-size="20" font-weight="600">add gate</text><text x="85" y="225" text-anchor="middle" fill="#444444" font-size="19">Fail on secrets</text></g>
    <g transform="translate(870 220)"><circle cx="85" cy="110" r="76" fill="#e6f8ed" stroke="#c0792b" stroke-width="3"/><text x="85" y="100" text-anchor="middle" fill="#252525" font-size="34" font-weight="700">04</text><text x="85" y="135" text-anchor="middle" fill="#252525" font-size="20" font-weight="600">Gitleaks</text><text x="85" y="225" text-anchor="middle" fill="#444444" font-size="19">Scan before commit</text></g>
    <g transform="translate(1130 220)"><circle cx="85" cy="110" r="76" fill="#fff0dc" stroke="#b84634" stroke-width="3"/><text x="85" y="100" text-anchor="middle" fill="#b84634" font-size="34" font-weight="700">05</text><text x="85" y="135" text-anchor="middle" fill="#252525" font-weight="600" style="font-size:15px">Review Staged Files</text><text x="85" y="225" text-anchor="middle" fill="#444444" font-size="19">Tools do not judge</text></g>
  </g>
  <rect x="312" y="550" width="816" height="82" rx="20" fill="#ffffff" stroke="#2b3a57"/>
  <text x="720" y="584" text-anchor="middle" fill="#252525" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="650">If any defense fails, stop and fix it locally</text>
  <text x="720" y="616" text-anchor="middle" fill="#444444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">Do not replace prevention with “push first and wait for GitHub alerts”</text>
</svg>
