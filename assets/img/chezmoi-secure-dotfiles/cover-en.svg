<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sync Configuration, Never Expose Secrets</title>
  <desc id="desc">Plain configuration enters Git, sensitive configuration is encrypted, and runtime data stays local.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111d35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1440" cy="90" r="240" fill="#68d5e8" opacity=".05"/>
  <circle cx="110" cy="810" r="310" fill="#a78bfa" opacity=".05"/>
  <text x="110" y="145" fill="#68d5e8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="600" letter-spacing="5">CHEZMOI · DOTFILES · AGE</text>
  <text x="110" y="245" fill="#f5f7fb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="76" font-weight="700">Configuration Syncs</text>
  <text x="110" y="335" fill="#f5f7fb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="76" font-weight="700">Secrets Stay Protected</text>
  <text x="114" y="405" fill="#aab7cf" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30">A recoverable, auditable Mac setup that never leaves passwords to chance</text>

  <g filter="url(#shadow)">
    <rect x="110" y="510" width="330" height="210" rx="28" fill="#151f35" stroke="#2b3a57"/>
    <circle cx="165" cy="570" r="23" fill="#6dda9a" opacity=".18"/>
    <path d="M153 570l8 8 16-19" fill="none" stroke="#6dda9a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="205" y="580" fill="#f5f7fb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="31" font-weight="650">Plain Config</text>
    <text x="150" y="635" fill="#aab7cf" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23">zsh · Ghostty · rules</text>
    <text x="150" y="677" fill="#6dda9a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23">Plaintext in Git</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="510" width="330" height="210" rx="28" fill="#151f35" stroke="#2b3a57"/>
    <rect x="145" y="0" width="46" height="42" rx="9" fill="#f4c66a" opacity=".16" transform="translate(500 550)"/>
    <path d="M662 559v-8a13 13 0 0126 0v8m-33 0h40v34h-40z" fill="none" stroke="#f4c66a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="595" y="635" fill="#f5f7fb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="31" font-weight="650">Sensitive Config</text>
    <text x="547" y="677" fill="#f4c66a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23">Encrypted with age</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="890" y="510" width="330" height="210" rx="28" fill="#151f35" stroke="#2b3a57"/>
    <circle cx="945" cy="570" r="23" fill="#f08080" opacity=".16"/>
    <path d="M933 558l24 24m0-24l-24 24" stroke="#f08080" stroke-width="7" stroke-linecap="round"/>
    <text x="985" y="580" fill="#f5f7fb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="31" font-weight="650">Runtime Data</text>
    <text x="930" y="635" fill="#aab7cf" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23">sessions · logs · cache</text>
    <text x="930" y="677" fill="#f08080" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23">Never enters Git</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M1395 506l105 38v78c0 79-44 135-105 166-61-31-105-87-105-166v-78z" fill="#172b45" stroke="#68d5e8" stroke-width="4"/>
    <path d="M1352 635l30 30 58-68" fill="none" stroke="#68d5e8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1395" y="735" text-anchor="middle" fill="#f5f7fb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="650">Private Repo</text>
  </g>
</svg>
