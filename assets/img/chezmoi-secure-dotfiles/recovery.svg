<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">新设备安全恢复流程</title>
  <desc id="desc">从基础工具、GitHub 身份、age identity 到预演和应用的恢复顺序。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111d35"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#68d5e8"/></marker></defs>
  <rect width="1440" height="720" rx="32" fill="url(#bg)"/>
  <text x="72" y="88" fill="#f5f7fb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="700">换台 Mac：先让它“演习”，再真的落文件</text>
  <text x="72" y="134" fill="#aab7cf" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24">恢复不是一条魔法命令，而是一条可以停下检查的链。</text>
  <path d="M155 330H1290" stroke="#27415b" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(70 220)"><rect width="210" height="220" rx="24" fill="#152238" stroke="#2b3a57"/><circle cx="105" cy="68" r="36" fill="#68d5e8" opacity=".16"/><text x="105" y="78" text-anchor="middle" fill="#68d5e8" font-size="28" font-weight="700">01</text><text x="105" y="132" text-anchor="middle" fill="#f5f7fb" font-size="23" font-weight="650">基础工具</text><text x="105" y="170" text-anchor="middle" fill="#aab7cf" font-size="18">CLT · Homebrew</text><text x="105" y="198" text-anchor="middle" fill="#aab7cf" font-size="18">chezmoi · age</text></g>
    <g transform="translate(340 220)"><rect width="210" height="220" rx="24" fill="#152238" stroke="#2b3a57"/><circle cx="105" cy="68" r="36" fill="#6dda9a" opacity=".16"/><text x="105" y="78" text-anchor="middle" fill="#6dda9a" font-size="28" font-weight="700">02</text><text x="105" y="132" text-anchor="middle" fill="#f5f7fb" font-size="23" font-weight="650">GitHub 身份</text><text x="105" y="170" text-anchor="middle" fill="#aab7cf" font-size="18">gh auth login</text><text x="105" y="198" text-anchor="middle" fill="#aab7cf" font-size="18">读取 Private Repo</text></g>
    <g transform="translate(610 220)"><rect width="210" height="220" rx="24" fill="#152238" stroke="#625238"/><circle cx="105" cy="68" r="36" fill="#f4c66a" opacity=".16"/><text x="105" y="78" text-anchor="middle" fill="#f4c66a" font-size="28" font-weight="700">03</text><text x="105" y="132" text-anchor="middle" fill="#f5f7fb" font-size="23" font-weight="650">恢复 identity</text><text x="105" y="170" text-anchor="middle" fill="#aab7cf" font-size="18">独立安全来源</text><text x="105" y="198" text-anchor="middle" fill="#aab7cf" font-size="18">权限设为 0600</text></g>
    <g transform="translate(880 220)"><rect width="210" height="220" rx="24" fill="#152238" stroke="#554c76"/><circle cx="105" cy="68" r="36" fill="#a78bfa" opacity=".16"/><text x="105" y="78" text-anchor="middle" fill="#a78bfa" font-size="28" font-weight="700">04</text><text x="105" y="132" text-anchor="middle" fill="#f5f7fb" font-size="23" font-weight="650">只预演</text><text x="105" y="170" text-anchor="middle" fill="#aab7cf" font-size="18">init · diff</text><text x="105" y="198" text-anchor="middle" fill="#aab7cf" font-size="18">apply --dry-run</text></g>
    <g transform="translate(1150 220)"><rect width="210" height="220" rx="24" fill="#152238" stroke="#315343"/><circle cx="105" cy="68" r="36" fill="#6dda9a" opacity=".16"/><text x="105" y="78" text-anchor="middle" fill="#6dda9a" font-size="28" font-weight="700">05</text><text x="105" y="132" text-anchor="middle" fill="#f5f7fb" font-size="23" font-weight="650">应用并验收</text><text x="105" y="170" text-anchor="middle" fill="#aab7cf" font-size="18">逐项打开工具</text><text x="105" y="198" text-anchor="middle" fill="#aab7cf" font-size="18">不是只看零报错</text></g>
  </g>
  <rect x="385" y="520" width="670" height="88" rx="22" fill="#152238" stroke="#2b3a57"/>
  <text x="720" y="557" text-anchor="middle" fill="#f5f7fb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="650">看到陌生删除、错误路径或模板空值，就停在 dry-run</text>
  <text x="720" y="590" text-anchor="middle" fill="#aab7cf" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">恢复速度不值得拿现有环境冒险</text>
</svg>
