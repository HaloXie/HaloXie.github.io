<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">分四批迁移开发环境</title>
  <desc id="desc">从低风险基础配置开始，最后处理 SSH、数据库和代理配置。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111d35"/></linearGradient></defs>
  <rect width="1440" height="760" rx="32" fill="url(#bg)"/>
  <text x="72" y="88" fill="#f5f7fb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="700">别一天搬完：风险应该一批一批增加</text>
  <text x="72" y="134" fill="#aab7cf" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24">每一批都能独立验证，出错时才知道该回到哪里。</text>

  <path d="M150 590C360 590 340 245 560 245s190 345 410 345 175-345 330-345" fill="none" stroke="#2b3a57" stroke-width="8" stroke-linecap="round"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(75 430)"><rect width="280" height="190" rx="24" fill="#152238" stroke="#45667b" stroke-width="2"/><circle cx="45" cy="45" r="23" fill="#68d5e8" opacity=".18"/><text x="45" y="54" text-anchor="middle" fill="#68d5e8" font-size="24" font-weight="700">1</text><text x="82" y="53" fill="#f5f7fb" font-size="25" font-weight="650">基础配置</text><text x="30" y="100" fill="#aab7cf" font-size="19">Zsh · Git · Ghostty</text><text x="30" y="132" fill="#aab7cf" font-size="19">Hammerspoon · Finicky</text><text x="30" y="166" fill="#6dda9a" font-size="18">风险最低，先建立手感</text></g>
    <g transform="translate(430 175)"><rect width="300" height="190" rx="24" fill="#152238" stroke="#4b5d72" stroke-width="2"/><circle cx="45" cy="45" r="23" fill="#6dda9a" opacity=".18"/><text x="45" y="54" text-anchor="middle" fill="#6dda9a" font-size="24" font-weight="700">2</text><text x="82" y="53" fill="#f5f7fb" font-size="25" font-weight="650">工具清单</text><text x="30" y="100" fill="#aab7cf" font-size="19">Brewfile · pnpm</text><text x="30" y="132" fill="#aab7cf" font-size="19">NVM · Conda manifests</text><text x="30" y="166" fill="#6dda9a" font-size="18">保存声明，不复制安装目录</text></g>
    <g transform="translate(790 430)"><rect width="300" height="190" rx="24" fill="#152238" stroke="#554c76" stroke-width="2"/><circle cx="45" cy="45" r="23" fill="#a78bfa" opacity=".18"/><text x="45" y="54" text-anchor="middle" fill="#a78bfa" font-size="24" font-weight="700">3</text><text x="82" y="53" fill="#f5f7fb" font-size="25" font-weight="650">IDE 与 Agent</text><text x="30" y="100" fill="#aab7cf" font-size="19">Cursor · VS Code · Codex</text><text x="30" y="132" fill="#aab7cf" font-size="19">Claude · pi · rules</text><text x="30" y="166" fill="#a78bfa" font-size="18">排除 auth、会话和日志</text></g>
    <g transform="translate(1110 175)"><rect width="260" height="190" rx="24" fill="#152238" stroke="#68454a" stroke-width="2"/><circle cx="45" cy="45" r="23" fill="#f08080" opacity=".18"/><text x="45" y="54" text-anchor="middle" fill="#f08080" font-size="24" font-weight="700">4</text><text x="82" y="53" fill="#f5f7fb" font-size="25" font-weight="650">敏感配置</text><text x="30" y="100" fill="#aab7cf" font-size="19">SSH · Database</text><text x="30" y="132" fill="#aab7cf" font-size="19">ClashX · Nginx</text><text x="30" y="166" fill="#f08080" font-size="18">最后处理，逐个验收</text></g>
  </g>
</svg>
