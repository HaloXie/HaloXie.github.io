<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Choose an AI pattern by path uncertainty and error cost</title><desc id="desc">A matrix: uncertain paths favor Agents, while costly errors require Workflows, human confirmation, or Hybrid guardrails.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#292929"/></marker><style>.i{stroke:#292929;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.s{font-family:Arial Unicode MS;fill:#1d1d1d}.t{font-size:40px;font-weight:750}.h{font-size:27px;font-weight:700}.b{font-size:18px;font-weight:550}</style></defs><rect width="1200" height="675" fill="#f6f0df"/><text x="600" y="59" text-anchor="middle" class="s t">Path uncertainty first, error cost second</text><path d="M170 570 V135 M170 570 H1092" class="i" marker-end="url(#a)"/><text x="620" y="625" text-anchor="middle" class="s h">Path uncertainty: low → high</text><text transform="translate(65 370) rotate(-90)" text-anchor="middle" class="s h">Cost of error: low → high</text><rect x="172" y="352" width="450" height="216" fill="#90c7dc" opacity=".78" class="i"/><rect x="622" y="352" width="468" height="216" fill="#f4b66e" opacity=".78" class="i"/><rect x="172" y="136" width="450" height="216" fill="#ffd36a" opacity=".78" class="i"/><rect x="622" y="136" width="468" height="216" fill="#dcebc1" opacity=".85" class="i"/><g class="s"><text x="397" y="410" text-anchor="middle" class="h">CHAT</text><text x="397" y="447" text-anchor="middle" class="b">human-driven discussion and correction</text><text x="856" y="410" text-anchor="middle" class="h">AGENT</text><text x="856" y="447" text-anchor="middle" class="b">explore within tool and budget limits</text><text x="397" y="205" text-anchor="middle" class="h">WORKFLOW</text><text x="397" y="242" text-anchor="middle" class="b">fixed flow, validation, approval</text><text x="856" y="205" text-anchor="middle" class="h">HYBRID</text><text x="856" y="242" text-anchor="middle" class="b">hard outer gates, bounded exploration</text></g><rect x="270" y="80" width="660" height="44" rx="12" fill="#fff2aa" class="i"/><text x="600" y="109" text-anchor="middle" class="s b">High risk does not forbid Agents; it narrows their action boundary</text></svg>
