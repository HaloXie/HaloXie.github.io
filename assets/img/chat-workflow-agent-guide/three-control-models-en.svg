<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Chat, Workflow, and Agent describe different dimensions</title><desc id="desc">Chat is an interface; a Workflow follows software-defined paths; an Agent lets the model choose the next action within guardrails.</desc>
  <defs><filter id="w" x="-3%" y="-5%" width="106%" height="110%"><feTurbulence baseFrequency=".012" numOctaves="1" seed="17"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#292929"/></marker><style>.i{stroke:#292929;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.s{font-family:Arial Unicode MS;fill:#1d1d1d}.t{font-size:40px;font-weight:750}.h{font-size:27px;font-weight:700}.b{font-size:20px;font-weight:550}.n{font-size:17px;fill:#444}</style></defs>
  <rect width="1200" height="675" fill="#f6f0df"/><g class="s"><text x="600" y="60" text-anchor="middle" class="t">Separate the interface from runtime control</text><text x="600" y="94" text-anchor="middle" class="b">The useful question is: who decides the next step?</text></g>
  <g filter="url(#w)"><rect x="62" y="150" width="1076" height="132" rx="22" fill="#90c7dc" class="i"/><text x="600" y="196" text-anchor="middle" class="s h">CHAT · how a person enters the system</text><path d="M188 220 h178 v40 H188z M834 220 h178 v40 H834z" fill="#fffdf7" class="i"/><text x="277" y="247" text-anchor="middle" class="s b">chat interface</text><text x="923" y="247" text-anchor="middle" class="s b">or no chat at all</text><path d="M378 240 H816" class="i" marker-end="url(#a)"/>
  <rect x="62" y="348" width="500" height="235" rx="22" fill="#ffd36a" class="i"/><text x="312" y="397" text-anchor="middle" class="s h">WORKFLOW</text><text x="312" y="431" text-anchor="middle" class="s b">software defines the route</text><circle cx="160" cy="494" r="30" fill="#fffdf7" class="i"/><circle cx="312" cy="494" r="30" fill="#fffdf7" class="i"/><circle cx="464" cy="494" r="30" fill="#fffdf7" class="i"/><path d="M192 494 H278 M344 494 H430" class="i" marker-end="url(#a)"/><text x="312" y="557" text-anchor="middle" class="s n">fixed steps · known branches · predictable</text>
  <rect x="638" y="348" width="500" height="235" rx="22" fill="#dcebc1" class="i"/><text x="888" y="397" text-anchor="middle" class="s h">AGENT</text><text x="888" y="431" text-anchor="middle" class="s b">the model chooses within guardrails</text><circle cx="888" cy="488" r="43" fill="#fffdf7" class="i"/><path d="M888 445 C1010 430 1048 501 968 533 M888 445 C768 430 725 501 808 533" fill="none" class="i" marker-end="url(#a)"/><text x="888" y="496" text-anchor="middle" class="s b">observe</text><rect x="747" y="542" width="282" height="29" rx="9" fill="#fffdf7"/><text x="888" y="562" text-anchor="middle" class="s n">act · read result · decide again</text></g>
</svg>
