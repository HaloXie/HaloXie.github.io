<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Chat、Workflow 与 Agent 不完全在同一维度</title><desc id="desc">Chat 描述交互入口；Workflow 由程序预设路径；Agent 由模型在护栏内决定下一步。</desc>
  <defs><filter id="w" x="-3%" y="-5%" width="106%" height="110%"><feTurbulence baseFrequency=".012" numOctaves="1" seed="17"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#292929"/></marker><style>.i{stroke:#292929;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.s{font-family:Arial Unicode MS;fill:#1d1d1d}.t{font-size:40px;font-weight:750}.h{font-size:27px;font-weight:700}.b{font-size:20px;font-weight:550}.n{font-size:17px;fill:#444}</style></defs>
  <rect width="1200" height="675" fill="#f6f0df"/><g class="s"><text x="600" y="60" text-anchor="middle" class="t">先分清：交互入口 vs 运行时控制</text><text x="600" y="94" text-anchor="middle" class="b">真正区分 Workflow 与 Agent 的问题是：谁决定下一步？</text></g>
  <g filter="url(#w)"><rect x="62" y="150" width="1076" height="132" rx="22" fill="#90c7dc" class="i"/><text x="600" y="196" text-anchor="middle" class="s h">CHAT · 人如何进入系统</text><path d="M188 220 h178 v40 H188z M834 220 h178 v40 H834z" fill="#fffdf7" class="i"/><text x="277" y="247" text-anchor="middle" class="s b">聊天界面</text><text x="923" y="247" text-anchor="middle" class="s b">也可以没有 Chat</text><path d="M378 240 H816" class="i" marker-end="url(#a)"/>
  <rect x="62" y="348" width="500" height="235" rx="22" fill="#ffd36a" class="i"/><text x="312" y="397" text-anchor="middle" class="s h">WORKFLOW</text><text x="312" y="431" text-anchor="middle" class="s b">程序预先决定路径</text><circle cx="160" cy="494" r="30" fill="#fffdf7" class="i"/><circle cx="312" cy="494" r="30" fill="#fffdf7" class="i"/><circle cx="464" cy="494" r="30" fill="#fffdf7" class="i"/><path d="M192 494 H278 M344 494 H430" class="i" marker-end="url(#a)"/><text x="312" y="557" text-anchor="middle" class="s n">固定步骤 · 预设分支 · 可预测</text>
  <rect x="638" y="348" width="500" height="235" rx="22" fill="#dcebc1" class="i"/><text x="888" y="397" text-anchor="middle" class="s h">AGENT</text><text x="888" y="431" text-anchor="middle" class="s b">模型在护栏内决定下一步</text><circle cx="888" cy="498" r="43" fill="#fffdf7" class="i"/><path d="M888 455 C1010 440 1048 515 965 551 M888 455 C768 440 725 515 810 551" fill="none" class="i" marker-end="url(#a)"/><text x="888" y="506" text-anchor="middle" class="s b">观察</text><text x="888" y="557" text-anchor="middle" class="s n">选择动作 · 读结果 · 再判断</text></g>
</svg>
