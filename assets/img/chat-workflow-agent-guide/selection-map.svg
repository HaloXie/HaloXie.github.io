<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">用路径确定性和错误代价选择 AI 模式</title><desc id="desc">二维矩阵：路径越不确定越需要 Agent，错误代价越高越需要 Workflow、人工确认或 Hybrid 护栏。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#292929"/></marker><style>.i{stroke:#292929;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.s{font-family:Arial Unicode MS;fill:#1d1d1d}.t{font-size:40px;font-weight:750}.h{font-size:27px;font-weight:700}.b{font-size:18px;font-weight:550}.n{font-size:16px;fill:#444}</style></defs><rect width="1200" height="675" fill="#f6f0df"/><text x="600" y="59" text-anchor="middle" class="s t">先看路径确定性，再看错误代价</text><path d="M170 570 V135 M170 570 H1092" class="i" marker-end="url(#a)"/><text x="620" y="625" text-anchor="middle" class="s h">路径不确定性：低 → 高</text><text transform="translate(65 370) rotate(-90)" text-anchor="middle" class="s h">错误代价：低 → 高</text><rect x="172" y="352" width="450" height="216" fill="#90c7dc" opacity=".78" class="i"/><rect x="622" y="352" width="468" height="216" fill="#f4b66e" opacity=".78" class="i"/><rect x="172" y="136" width="450" height="216" fill="#ffd36a" opacity=".78" class="i"/><rect x="622" y="136" width="468" height="216" fill="#dcebc1" opacity=".85" class="i"/><g class="s"><text x="397" y="410" text-anchor="middle" class="h">CHAT</text><text x="397" y="447" text-anchor="middle" class="b">人在环内，快速讨论与纠偏</text><text x="856" y="410" text-anchor="middle" class="h">AGENT</text><text x="856" y="447" text-anchor="middle" class="b">允许探索，限制工具与预算</text><text x="397" y="205" text-anchor="middle" class="h">WORKFLOW</text><text x="397" y="242" text-anchor="middle" class="b">固定流程、验证与审批</text><text x="856" y="205" text-anchor="middle" class="h">HYBRID</text><text x="856" y="242" text-anchor="middle" class="b">外层硬门禁，内层受约束探索</text></g><rect x="294" y="80" width="612" height="44" rx="12" fill="#fff2aa" class="i"/><text x="600" y="109" text-anchor="middle" class="s b">高风险不会消灭 Agent，但必须缩小它的行动边界</text></svg>
