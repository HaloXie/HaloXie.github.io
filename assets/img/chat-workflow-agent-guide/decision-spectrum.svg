<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">从固定流程到 Agent Loop 的决策权光谱</title><desc id="desc">固定 Workflow、Router、工具自动匹配和受约束 Agent Loop 逐级增加模型的运行时决策权。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#292929"/></marker><style>.i{stroke:#292929;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.s{font-family:Arial Unicode MS;fill:#1d1d1d}.t{font-size:40px;font-weight:750}.h{font-size:24px;font-weight:700}.b{font-size:18px;font-weight:550}.n{font-size:16px;fill:#444}</style></defs><rect width="1200" height="675" fill="#f6f0df"/><text x="600" y="62" text-anchor="middle" class="s t">Agent 不是开关，而是决策权光谱</text><text x="600" y="98" text-anchor="middle" class="s b">向右：模型根据运行结果拥有更多下一步选择</text><path d="M105 157 H1090" class="i" marker-end="url(#a)"/><text x="105" y="137" class="s n">程序控制更多</text><text x="1090" y="137" text-anchor="end" class="s n">模型决策更多</text>
  <g><rect x="70" y="205" width="245" height="320" rx="20" fill="#90c7dc" class="i"/><text x="192" y="254" text-anchor="middle" class="s h">固定 Workflow</text><text x="192" y="298" text-anchor="middle" class="s b">模型生成节点内容</text><text x="192" y="330" text-anchor="middle" class="s b">程序决定所有步骤</text><path d="M116 395 H268 M116 432 H268" class="i"/><circle cx="116" cy="395" r="13" fill="#fffdf7" class="i"/><circle cx="192" cy="395" r="13" fill="#fffdf7" class="i"/><circle cx="268" cy="395" r="13" fill="#fffdf7" class="i"/><text x="192" y="486" text-anchor="middle" class="s n">确定路径</text>
  <rect x="340" y="205" width="245" height="320" rx="20" fill="#ffd36a" class="i"/><text x="462" y="254" text-anchor="middle" class="s h">Router</text><text x="462" y="298" text-anchor="middle" class="s b">模型选择预设类别</text><text x="462" y="330" text-anchor="middle" class="s b">程序映射固定路径</text><path d="M462 380 V420 M462 420 L399 458 M462 420 L525 458" class="i" marker-end="url(#a)"/><text x="462" y="486" text-anchor="middle" class="s n">动态分支</text>
  <rect x="610" y="205" width="245" height="320" rx="20" fill="#f4b66e" class="i"/><text x="732" y="254" text-anchor="middle" class="s h">工具自动匹配</text><text x="732" y="298" text-anchor="middle" class="s b">模型选择一个动作</text><text x="732" y="330" text-anchor="middle" class="s b">候选与后续由程序控制</text><rect x="654" y="384" width="58" height="58" rx="10" fill="#fffdf7" class="i"/><rect x="724" y="384" width="58" height="58" rx="10" fill="#fffdf7" class="i"/><rect x="794" y="384" width="38" height="58" rx="10" fill="#fffdf7" class="i"/><text x="732" y="486" text-anchor="middle" class="s n">一次选择</text>
  <rect x="880" y="205" width="250" height="320" rx="20" fill="#dcebc1" class="i"/><text x="1005" y="254" text-anchor="middle" class="s h">受约束 Agent Loop</text><text x="1005" y="298" text-anchor="middle" class="s b">观察结果后持续决策</text><text x="1005" y="330" text-anchor="middle" class="s b">自主判断继续或结束</text><circle cx="1005" cy="411" r="43" fill="#fffdf7" class="i"/><path d="M1005 368 C1100 370 1110 451 1048 466 M1005 368 C913 370 903 451 962 466" fill="none" class="i" marker-end="url(#a)"/><text x="1005" y="418" text-anchor="middle" class="s b">结果</text><text x="1005" y="496" text-anchor="middle" class="s n">循环决策</text></g><rect x="240" y="568" width="720" height="60" rx="15" fill="#fff2aa" class="i"/><text x="600" y="606" text-anchor="middle" class="s h">判断重点：模型能决定什么，而不是系统叫什么</text></svg>
