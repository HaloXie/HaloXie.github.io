<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Locate the problem before choosing the fix</title><desc id="desc">Wrong baseline, integration conflict, or wrong merge: different recovery paths</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#292929"/></marker></defs><rect width="1200" height="675" fill="#f6f0df"/><g font-family="Arial, sans-serif" fill="#292929"><text x="600" y="66" text-anchor="middle" font-size="37" font-weight="700">Locate the problem before choosing the fix</text><text x="600" y="110" text-anchor="middle" font-size="22" font-weight="400">Wrong baseline, integration conflict, or wrong merge: different recovery paths</text><rect x="60" y="155" width="280" height="110" rx="20" fill="#90c7dc" stroke="#292929" stroke-width="3"/><text x="200" y="200" text-anchor="middle" font-size="26" font-weight="700">Wrong baseline</text><text x="200" y="240" text-anchor="middle" font-size="22" font-weight="400">Development branch</text><path d="M340 210 H400" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><rect x="415" y="155" width="725" height="110" rx="20" fill="#fffdf7" stroke="#292929" stroke-width="3"/><text x="777" y="200" text-anchor="middle" font-size="26" font-weight="700">Create a clean branch from main</text><text x="777" y="241" text-anchor="middle" font-size="25" font-weight="400">Check and transfer only your commits</text><rect x="60" y="290" width="280" height="110" rx="20" fill="#ffd36a" stroke="#292929" stroke-width="3"/><text x="200" y="335" text-anchor="middle" font-size="26" font-weight="700">Integration conflict</text><text x="200" y="375" text-anchor="middle" font-size="22" font-weight="400">develop</text><path d="M340 345 H400" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><rect x="415" y="290" width="725" height="110" rx="20" fill="#fffdf7" stroke="#292929" stroke-width="3"/><text x="777" y="335" text-anchor="middle" font-size="26" font-weight="700">Separate feature defects from integration conflicts</text><text x="777" y="376" text-anchor="middle" font-size="25" font-weight="400">Fix the relevant branches, then test the combination</text><rect x="60" y="425" width="280" height="110" rx="20" fill="#f4b66e" stroke="#292929" stroke-width="3"/><text x="200" y="470" text-anchor="middle" font-size="26" font-weight="700">Wrong main merge</text><text x="200" y="510" text-anchor="middle" font-size="22" font-weight="400">master/main</text><path d="M340 480 H400" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><rect x="415" y="425" width="725" height="110" rx="20" fill="#fffdf7" stroke="#292929" stroke-width="3"/><text x="777" y="470" text-anchor="middle" font-size="26" font-weight="700">Runtime affected? Assess restoration first</text><text x="777" y="511" text-anchor="middle" font-size="25" font-weight="400">fix / revert → test → MR</text><rect x="80" y="582" width="1040" height="58" rx="14" fill="#fff2aa" stroke="#292929" stroke-width="3"/><text x="600" y="620" text-anchor="middle" font-size="25" font-weight="700">Revalidate every fix; previous test results do not carry forward</text></g></svg>
