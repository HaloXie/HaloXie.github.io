<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Start each Sprint from a clean baseline</title><desc id="desc">Rebuild the test branch; preserve unfinished development work</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#292929"/></marker></defs><rect width="1200" height="675" fill="#fff9e9"/><g font-family="Arial, sans-serif" fill="#292929"><text x="600" y="66" text-anchor="middle" font-size="40" font-weight="700">Start each Sprint from a clean baseline</text><text x="600" y="110" text-anchor="middle" font-size="24" font-weight="400">Rebuild the test branch; preserve unfinished development work</text><rect x="60" y="165" width="320" height="155" rx="20" fill="#79cef2" stroke="#292929" stroke-width="3"/><text x="220" y="210" text-anchor="middle" font-size="26" font-weight="700">01  Create test space</text><text x="220" y="251" text-anchor="middle" font-size="22" font-weight="400">From latest master/main</text><text x="220" y="287" text-anchor="middle" font-size="22" font-weight="400">Create develop</text><rect x="440" y="165" width="320" height="155" rx="20" fill="#ffdc67" stroke="#292929" stroke-width="3"/><text x="600" y="210" text-anchor="middle" font-size="26" font-weight="700">02  Test together</text><text x="600" y="251" text-anchor="middle" font-size="22" font-weight="400">Merge human / AI branches</text><text x="600" y="287" text-anchor="middle" font-size="22" font-weight="400">Record versions and results</text><rect x="820" y="165" width="320" height="155" rx="20" fill="#ade6bd" stroke="#292929" stroke-width="3"/><text x="980" y="210" text-anchor="middle" font-size="26" font-weight="700">03  Merge separately</text><text x="980" y="251" text-anchor="middle" font-size="22" font-weight="400">Tests and review pass</text><text x="980" y="287" text-anchor="middle" font-size="22" font-weight="400">Original branch MR → main</text><rect x="440" y="390" width="700" height="140" rx="20" fill="#ffb366" stroke="#292929" stroke-width="3"/><text x="790" y="435" text-anchor="middle" font-size="26" font-weight="700">04  Close and rebuild</text><text x="790" y="476" text-anchor="middle" font-size="22" font-weight="400">Inventory branches → save fixes → coordinate rebuild</text><path d="M380 243 H430" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M760 243 H810" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M980 320 V380" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M440 460 H220 V330" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><rect x="80" y="582" width="1040" height="58" rx="14" fill="#fff0a5" stroke="#292929" stroke-width="3"/><text x="600" y="620" text-anchor="middle" font-size="22" font-weight="700">After rebuilding: merge pending branches again, redeploy, and retest</text></g></svg>
