<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">共享测试，独立交付</title><desc id="desc">三个独立改动在同一测试区域中验证，各自保留清晰的交付边界。</desc>
<rect width="1200" height="675" fill="#f6f0df"/>
<g font-family="Arial Unicode MS, PingFang SC, sans-serif" fill="#292929">
<text x="80" y="118" font-size="24" letter-spacing="4">SPRINT · GIT FLOW</text>
<text x="80" y="218" font-size="60" font-weight="700">共享测试</text><text x="80" y="295" font-size="60" font-weight="700">独立交付</text>
<path d="M82 339 H235" stroke="#292929" stroke-width="4"/>
<text x="80" y="399" font-size="26">让改动一起接受验证</text><text x="80" y="444" font-size="26">让每次合并保持清晰</text>
<rect x="530" y="132" width="580" height="412" rx="32" fill="#fffdf7" stroke="#292929" stroke-width="3" stroke-dasharray="10 9"/>
<text x="820" y="193" text-anchor="middle" font-size="27">同一个测试空间</text>
<g stroke="#292929" stroke-width="3">
<rect x="579" y="237" width="142" height="206" rx="20" fill="#90c7dc" transform="rotate(-4 650 340)"/>
<rect x="749" y="237" width="142" height="206" rx="20" fill="#ffd36a"/>
<rect x="919" y="237" width="142" height="206" rx="20" fill="#dcebc1" transform="rotate(4 990 340)"/>
<path d="M615 287 H677 M615 305 H660 M785 287 H847 M785 305 H830 M955 287 H1017 M955 305 H1000" fill="none" stroke-linecap="round"/>
<circle cx="649" cy="373" r="23" fill="#fffdf7"/><circle cx="820" cy="373" r="23" fill="#fffdf7"/><circle cx="991" cy="373" r="23" fill="#fffdf7"/>
<path d="M638 373 L646 381 L661 363 M809 373 L817 381 L832 363 M980 373 L988 381 L1003 363" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g><text x="820" y="500" text-anchor="middle" font-size="24">每项改动，保留自己的边界</text>
<text x="80" y="602" font-size="22" fill="#555">一种面向团队迭代的分支协作实践</text>
</g></svg>
