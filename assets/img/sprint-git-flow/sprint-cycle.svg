<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">每轮 Sprint，都从干净基线开始</title><desc id="desc">测试分支可以重建，未完成的开发工作必须保留</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#292929"/></marker></defs><rect width="1200" height="675" fill="#f6f0df"/><g font-family="Arial Unicode MS, PingFang SC, sans-serif" fill="#292929"><text x="600" y="66" text-anchor="middle" font-size="40" font-weight="700">每轮 Sprint，都从干净基线开始</text><text x="600" y="110" text-anchor="middle" font-size="24" font-weight="400">测试分支可以重建，未完成的开发工作必须保留</text><rect x="60" y="165" width="320" height="155" rx="20" fill="#90c7dc" stroke="#292929" stroke-width="3"/><text x="220" y="210" text-anchor="middle" font-size="30" font-weight="700">01  建立沙箱</text><text x="220" y="251" text-anchor="middle" font-size="25" font-weight="400">从最新 master/main</text><text x="220" y="287" text-anchor="middle" font-size="25" font-weight="400">创建 develop</text><rect x="440" y="165" width="320" height="155" rx="20" fill="#ffd36a" stroke="#292929" stroke-width="3"/><text x="600" y="210" text-anchor="middle" font-size="30" font-weight="700">02  组合测试</text><text x="600" y="251" text-anchor="middle" font-size="25" font-weight="400">各功能分支合入</text><text x="600" y="287" text-anchor="middle" font-size="25" font-weight="400">验证交叉影响</text><rect x="820" y="165" width="320" height="155" rx="20" fill="#dcebc1" stroke="#292929" stroke-width="3"/><text x="980" y="210" text-anchor="middle" font-size="30" font-weight="700">03  分别合并</text><text x="980" y="251" text-anchor="middle" font-size="25" font-weight="400">测试与审查通过</text><text x="980" y="287" text-anchor="middle" font-size="25" font-weight="400">原分支 MR 回主干</text><rect x="440" y="390" width="700" height="140" rx="20" fill="#f4b66e" stroke="#292929" stroke-width="3"/><text x="790" y="435" text-anchor="middle" font-size="30" font-weight="700">04  收尾与重建</text><text x="790" y="476" text-anchor="middle" font-size="25" font-weight="400">盘点在测分支 → 保存必要修复 → 协调重建</text><path d="M380 243 H430" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M760 243 H810" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M980 320 V380" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M440 460 H220 V330" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><rect x="80" y="582" width="1040" height="58" rx="14" fill="#fff2aa" stroke="#292929" stroke-width="3"/><text x="600" y="620" text-anchor="middle" font-size="25" font-weight="700">重建后，待测分支重新合入、重新部署、重新验证</text></g></svg>