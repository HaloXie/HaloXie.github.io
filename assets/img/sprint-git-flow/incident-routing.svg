<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">先定位问题发生在哪一层</title><desc id="desc">开发基线、集成冲突、主干误合并，处理方式不同</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#292929"/></marker></defs><rect width="1200" height="675" fill="#f6f0df"/><g font-family="Arial Unicode MS, PingFang SC, sans-serif" fill="#292929"><text x="600" y="66" text-anchor="middle" font-size="40" font-weight="700">先定位问题发生在哪一层</text><text x="600" y="110" text-anchor="middle" font-size="24" font-weight="400">开发基线、集成冲突、主干误合并，处理方式不同</text><rect x="60" y="155" width="280" height="110" rx="20" fill="#90c7dc" stroke="#292929" stroke-width="3"/><text x="200" y="200" text-anchor="middle" font-size="30" font-weight="700">基线错误</text><text x="200" y="240" text-anchor="middle" font-size="24" font-weight="400">开发分支</text><path d="M340 210 H400" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><rect x="415" y="155" width="725" height="110" rx="20" fill="#fffdf7" stroke="#292929" stroke-width="3"/><text x="777" y="200" text-anchor="middle" font-size="30" font-weight="700">从主干建干净分支</text><text x="777" y="241" text-anchor="middle" font-size="25" font-weight="400">核对并迁移自己的提交</text><rect x="60" y="290" width="280" height="110" rx="20" fill="#ffd36a" stroke="#292929" stroke-width="3"/><text x="200" y="335" text-anchor="middle" font-size="30" font-weight="700">集成冲突</text><text x="200" y="375" text-anchor="middle" font-size="24" font-weight="400">develop</text><path d="M340 345 H400" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><rect x="415" y="290" width="725" height="110" rx="20" fill="#fffdf7" stroke="#292929" stroke-width="3"/><text x="777" y="335" text-anchor="middle" font-size="30" font-weight="700">区分功能缺陷与组合冲突</text><text x="777" y="376" text-anchor="middle" font-size="25" font-weight="400">修复对应分支，再集成测试</text><rect x="60" y="425" width="280" height="110" rx="20" fill="#f4b66e" stroke="#292929" stroke-width="3"/><text x="200" y="470" text-anchor="middle" font-size="30" font-weight="700">主干误合并</text><text x="200" y="510" text-anchor="middle" font-size="24" font-weight="400">master/main</text><path d="M340 480 H400" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><rect x="415" y="425" width="725" height="110" rx="20" fill="#fffdf7" stroke="#292929" stroke-width="3"/><text x="777" y="470" text-anchor="middle" font-size="30" font-weight="700">已影响运行？先评估恢复</text><text x="777" y="511" text-anchor="middle" font-size="25" font-weight="400">fix / revert → 测试 → MR</text><rect x="80" y="582" width="1040" height="58" rx="14" fill="#fff2aa" stroke="#292929" stroke-width="3"/><text x="600" y="620" text-anchor="middle" font-size="25" font-weight="700">所有修复都要重新验证，不能沿用旧的测试结论</text></g></svg>