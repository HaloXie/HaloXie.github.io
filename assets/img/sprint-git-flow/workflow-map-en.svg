<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Iteration coordination and release cadence</title><desc id="desc">Axes cross at the canvas center. Right favors batch coordination; up favors release when ready. Typical practices, not scores.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#292929"/></marker></defs>
