<text x="600" y="618" text-anchor="middle" font-size="21">Typical practices: the center separates tendencies, not capability scores</text>
<text x="600" y="653" text-anchor="middle" font-size="20" fill="#555">Release speed depends on tests, dependencies, and deployment—not branches alone</text>
