<text x="190" y="215" font-size="27" font-weight="700">Trunk-Based</text>
<text x="278" y="293" font-size="27" font-weight="700">GitHub Flow</text>
<text x="870" y="208" font-size="27" font-weight="700">This Flow</text>
<text x="730" y="248" font-size="21">Test together; ship when ready</text>
<text x="835" y="300" font-size="26" font-weight="700">AoneFlow</text>
<text x="771" y="445" font-size="27" font-weight="700">Classic GitFlow</text>
