<g font-family="Arial, sans-serif" fill="#292929">
<text x="600" y="58" text-anchor="middle" font-size="38" font-weight="700">How do teams coordinate and release?</text>
<rect x="90" y="100" width="1020" height="475" rx="20" fill="#ffffff"/>
<path d="M95 337.5 H1105" stroke="#292929" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M600 575 V105" stroke="#292929" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="619" y="130" font-size="21" font-weight="700">Release when ready</text>
<text x="619" y="563" font-size="21" font-weight="700">Fixed release windows</text>
<text x="111" y="323" font-size="21">Independent changes</text>
<text x="1090" y="371" text-anchor="end" font-size="21">Coordinate by Sprint / batch</text>
<text x="578" y="367" font-size="20">0</text>
<g stroke="#292929" stroke-width="3">
<circle cx="255" cy="175" r="12" fill="#79cef2"/>
<circle cx="413" cy="260" r="12" fill="#79cef2"/>
