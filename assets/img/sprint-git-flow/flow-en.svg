<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><title>Test together. Merge deliberately.</title><desc>Create a feature from main, test it on develop, then merge the feature through review.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#292929"/></marker></defs><rect width="1200" height="675" fill="#f6f0df"/><g font-family="Arial Unicode MS, PingFang SC, sans-serif" fill="#292929" text-anchor="middle"><text x="600" y="100" font-size="48" font-weight="700">Test together. Merge deliberately.</text><rect x="70" y="210" width="320" height="135" rx="20" fill="#90c7dc" stroke="#292929" stroke-width="3"/><text x="230" y="265" font-size="34" font-weight="700">main</text><text x="230" y="309" font-size="28">Production baseline</text><rect x="440" y="210" width="320" height="135" rx="20" fill="#ffd36a" stroke="#292929" stroke-width="3"/><text x="600" y="265" font-size="34" font-weight="700">feature</text><text x="600" y="309" font-size="28">One change</text><rect x="810" y="210" width="320" height="135" rx="20" fill="#f4b66e" stroke="#292929" stroke-width="3"/><text x="970" y="265" font-size="34" font-weight="700">develop</text><text x="970" y="309" font-size="28">Integration test</text><rect x="440" y="450" width="320" height="135" rx="20" fill="#dcebc1" stroke="#292929" stroke-width="3"/><text x="600" y="505" font-size="34" font-weight="700">MR → main</text><text x="600" y="549" font-size="28">Review + verify</text></g><g fill="none" stroke="#292929" stroke-width="4" marker-end="url(#a)"><path d="M390 275 H434"/><path d="M760 275 H804"/><path d="M600 345 V444"/><path d="M970 345 V517 H766" stroke-dasharray="9 7"/></g><text x="600" y="635" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, sans-serif" font-size="24" fill="#444">Solid: code path · Dashed: testing prerequisite</text></svg>