<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Test first. Merge the original branch.</title><desc id="desc">Features and fixes follow one path; failed tests return to development</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#292929"/></marker></defs><rect width="1200" height="675" fill="#fff9e9"/><g font-family="Arial, sans-serif" fill="#292929"><text x="600" y="60" text-anchor="middle" font-size="39">Test first. Merge the original branch.</text><text x="600" y="103" text-anchor="middle" font-size="19">Features and fixes follow one path; failed tests return to development</text><rect x="60" y="155" width="300" height="100" rx="16" fill="#79cef2" stroke="#292929" stroke-width="3"/><text x="210" y="195" text-anchor="middle" font-size="28">master/main</text><text x="210" y="232" text-anchor="middle" font-size="19">Start point · Release baseline</text><rect x="440" y="155" width="300" height="100" rx="16" fill="#ffdc67" stroke="#292929" stroke-width="3"/><text x="590" y="195" text-anchor="middle" font-size="28">① feat / fix / upd</text><text x="590" y="232" text-anchor="middle" font-size="19">From main · Human / AI work</text><rect x="820" y="155" width="320" height="100" rx="16" fill="#ffb366" stroke="#292929" stroke-width="3"/><text x="980" y="195" text-anchor="middle" font-size="28">② develop</text><text x="980" y="232" text-anchor="middle" font-size="19">CI deploys shared testing</text><path d="M360 205 H430" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M740 205 H810" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M980 255 V345" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M980 350 L1140 410 L980 470 L820 410 Z" fill="#fff0a5" stroke="#292929" stroke-width="3"/><text x="980" y="419" text-anchor="middle" font-size="27">③ Tests pass?</text><rect x="440" y="360" width="300" height="100" rx="16" fill="#ade6bd" stroke="#292929" stroke-width="3"/><text x="590" y="400" text-anchor="middle" font-size="23">④ MR from original branch</text><text x="590" y="437" text-anchor="middle" font-size="19">Code review → Merge to main</text><path d="M820 410 H750" fill="none" stroke="#292929" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="785" y="389" text-anchor="middle" font-size="19">Yes</text><path d="M980 470 V535 H1175 V125 H590 V145" fill="none" stroke="#292929" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="950" y="580" text-anchor="middle" font-size="19">No: fix the development branch</text><path d="M440 410 H390 V305 H310 V265" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><rect x="60" y="385" width="280" height="100" rx="16" fill="#79cef2" stroke="#292929" stroke-width="3"/><text x="200" y="425" text-anchor="middle" font-size="28">⑤ Tag on main</text><text x="200" y="462" text-anchor="middle" font-size="19">Build → gray → production</text><path d="M145 255 V375" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><text x="600" y="610" text-anchor="middle" font-size="19">Solid: code / deployment · Dashed: test results · Never merge all of develop into main</text></g></svg>
