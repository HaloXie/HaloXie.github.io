<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">并行实现，按验证结果发布</title><desc id="desc">人或 AI 从主干创建独立分支，共享环境串行集成测试；只有通过验证的分支进入主干，未通过的继续迭代，主干标签经过 gray 再上线。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#292929"/></marker></defs><rect width="1200" height="675" fill="#f6f0df"/><g font-family="Arial Unicode MS, PingFang SC, sans-serif" fill="#292929" text-anchor="middle"><text x="600" y="60" font-size="40" font-weight="700">并行实现，不按启动顺序上线</text><text x="600" y="103" font-size="25">人或 AI：从 master/main 创建独立分支与工作目录</text>
<g stroke="#292929" stroke-width="3"><rect x="60" y="150" width="320" height="130" rx="20" fill="#90c7dc"/><rect x="440" y="150" width="320" height="130" rx="20" fill="#ffd36a"/><rect x="820" y="150" width="320" height="130" rx="20" fill="#dcebc1"/>
<rect x="60" y="385" width="460" height="140" rx="20" fill="#fffdf7"/><rect x="670" y="385" width="470" height="140" rx="20" fill="#f4b66e"/></g>
<text x="220" y="196" font-size="29" font-weight="700">导出 / 查询</text><text x="220" y="244" font-size="25">未通过 → 继续迭代</text>
<text x="600" y="196" font-size="29" font-weight="700">筛选预设</text><text x="600" y="244" font-size="25">后开始，也能先验收</text>
<text x="980" y="196" font-size="29" font-weight="700">独立 bug 修复</text><text x="980" y="244" font-size="25">优先验证，不等新功能</text>
<g stroke="#292929" stroke-width="3" fill="none"><path d="M220 280 V325 H980 V280 M600 280 V325 M290 325 V375" marker-end="url(#a)"/><path d="M520 455 H660" stroke-dasharray="8 7" marker-end="url(#a)"/></g>
<text x="290" y="433" font-size="28" font-weight="700">develop → 测试环境</text><text x="290" y="478" font-size="24">串行部署 · 固定版本 · 记录验收</text>
<text x="593" y="425" font-size="23">验证放行</text>
<text x="905" y="433" font-size="28" font-weight="700">已放行分支 → MR 回主干</text><text x="905" y="478" font-size="24">不是将整个 develop 合回主干</text>
<path d="M905 525 V565" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#a)"/>
<rect x="410" y="578" width="730" height="60" rx="14" fill="#fff2aa" stroke="#292929" stroke-width="3"/><text x="775" y="617" font-size="27" font-weight="700">主干 tag → gray 验证 → 同一产物上线</text>
<text x="218" y="613" font-size="22" fill="#555">虚线是放行条件，不是代码合并</text>
</g></svg>
