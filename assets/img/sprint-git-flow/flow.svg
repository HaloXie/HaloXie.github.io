<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">先测试，再由开发分支回到主干</title><desc id="desc">所有功能、修复与优化都走同一条路径；未通过就返回修改</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#292929"/></marker></defs><rect width="1200" height="675" fill="#f6f0df"/><g font-family="Arial Unicode MS, PingFang SC, sans-serif" fill="#292929"><text x="600" y="60" text-anchor="middle" font-size="39">先测试，再由开发分支回到主干</text><text x="600" y="103" text-anchor="middle" font-size="23">所有功能、修复与优化都走同一条路径；未通过就返回修改</text><rect x="60" y="155" width="300" height="100" rx="16" fill="#90c7dc" stroke="#292929" stroke-width="3"/><text x="210" y="195" text-anchor="middle" font-size="28">master/main</text><text x="210" y="232" text-anchor="middle" font-size="23">开发起点 · 发布基线</text><rect x="440" y="155" width="300" height="100" rx="16" fill="#ffd36a" stroke="#292929" stroke-width="3"/><text x="590" y="195" text-anchor="middle" font-size="28">① feat / fix / upd</text><text x="590" y="232" text-anchor="middle" font-size="23">从主干创建 · 人或 AI 开发</text><rect x="820" y="155" width="320" height="100" rx="16" fill="#f4b66e" stroke="#292929" stroke-width="3"/><text x="980" y="195" text-anchor="middle" font-size="28">② develop</text><text x="980" y="232" text-anchor="middle" font-size="23">CI 部署共享测试环境</text><path d="M360 205 H430" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M740 205 H810" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M980 255 V345" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M980 350 L1140 410 L980 470 L820 410 Z" fill="#fff2aa" stroke="#292929" stroke-width="3"/><text x="980" y="419" text-anchor="middle" font-size="27">③ 测试通过？</text><rect x="440" y="360" width="300" height="100" rx="16" fill="#dcebc1" stroke="#292929" stroke-width="3"/><text x="590" y="400" text-anchor="middle" font-size="28">④ 原分支发起 MR</text><text x="590" y="437" text-anchor="middle" font-size="23">Code Review → 合并主干</text><path d="M820 410 H750" fill="none" stroke="#292929" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="785" y="389" text-anchor="middle" font-size="23">是</text><path d="M980 470 V535 H1175 V125 H590 V145" fill="none" stroke="#292929" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="950" y="580" text-anchor="middle" font-size="23">否：回开发分支修改</text><path d="M440 410 H390 V305 H310 V265" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><rect x="60" y="385" width="280" height="100" rx="16" fill="#90c7dc" stroke="#292929" stroke-width="3"/><text x="200" y="425" text-anchor="middle" font-size="28">⑤ 主干 tag</text><text x="200" y="462" text-anchor="middle" font-size="23">构建 → gray → 生产</text><path d="M145 255 V375" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><text x="600" y="610" text-anchor="middle" font-size="23">实线：代码／部署路径 · 虚线：测试结果；不将 develop 整体合回主干</text></g></svg>