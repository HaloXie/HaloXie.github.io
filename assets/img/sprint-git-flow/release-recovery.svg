<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">发布闭环：上线验证，失败恢复</title><desc id="desc">标签标记代码版本，部署使用可追踪的构建产物</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#292929"/></marker></defs><rect width="1200" height="675" fill="#f6f0df"/><g font-family="Arial Unicode MS, PingFang SC, sans-serif" fill="#292929"><text x="600" y="66" text-anchor="middle" font-size="40" font-weight="700">发布闭环：上线验证，失败恢复</text><text x="600" y="110" text-anchor="middle" font-size="24" font-weight="400">标签标记代码版本，部署使用可追踪的构建产物</text><rect x="60" y="175" width="320" height="145" rx="20" fill="#90c7dc" stroke="#292929" stroke-width="3"/><text x="220" y="220" text-anchor="middle" font-size="30" font-weight="700">01  标记版本</text><text x="220" y="261" text-anchor="middle" font-size="25" font-weight="400">主干候选提交 → tag</text><rect x="440" y="175" width="320" height="145" rx="20" fill="#ffd36a" stroke="#292929" stroke-width="3"/><text x="600" y="220" text-anchor="middle" font-size="30" font-weight="700">02  构建产物</text><text x="600" y="261" text-anchor="middle" font-size="25" font-weight="400">CI 构建并记录摘要</text><rect x="820" y="175" width="320" height="145" rx="20" fill="#dcebc1" stroke="#292929" stroke-width="3"/><text x="980" y="220" text-anchor="middle" font-size="30" font-weight="700">03  部署验证</text><text x="980" y="261" text-anchor="middle" font-size="25" font-weight="400">部署指定产物并验证</text><rect x="320" y="400" width="820" height="140" rx="20" fill="#f4b66e" stroke="#292929" stroke-width="3"/><text x="730" y="445" text-anchor="middle" font-size="30" font-weight="700">异常时：先判断能否安全回滚</text><text x="730" y="486" text-anchor="middle" font-size="25" font-weight="400">检查兼容性 → 恢复正常产物 → 修复并重新验证</text><path d="M380 250 H430" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M760 250 H810" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M980 320 V390" fill="none" stroke="#292929" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="145" y="475" text-anchor="middle" font-size="24" font-weight="400">通过：记录结果</text><rect x="80" y="582" width="1040" height="58" rx="14" fill="#fff2aa" stroke="#292929" stroke-width="3"/><text x="600" y="620" text-anchor="middle" font-size="25" font-weight="700">恢复运行之后，仍须通过修复 MR 完成代码闭环</text></g></svg>