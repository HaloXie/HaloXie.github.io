<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">上线以后，也要验证与恢复</title><desc id="desc">tag 触发构建；gray 与生产使用同一产物，部署成功不等于运行正常</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#292929"/></marker></defs><rect width="1200" height="675" fill="#f6f0df"/><g font-family="Arial Unicode MS, PingFang SC, sans-serif" fill="#292929"><text x="600" y="60" text-anchor="middle" font-size="39">上线以后，也要验证与恢复</text><text x="600" y="103" text-anchor="middle" font-size="23">tag 触发构建；gray 与生产使用同一产物，部署成功不等于运行正常</text><rect x="45" y="150" width="240" height="100" rx="16" fill="#90c7dc" stroke="#292929" stroke-width="3"/><text x="165" y="190" text-anchor="middle" font-size="28">主干候选提交</text><text x="165" y="227" text-anchor="middle" font-size="23">① 创建并推送 tag</text><rect x="340" y="150" width="240" height="100" rx="16" fill="#ffd36a" stroke="#292929" stroke-width="3"/><text x="460" y="190" text-anchor="middle" font-size="28">② CI 构建</text><text x="460" y="227" text-anchor="middle" font-size="23">记录版本与产物摘要</text><rect x="635" y="150" width="240" height="100" rx="16" fill="#f4b66e" stroke="#292929" stroke-width="3"/><text x="755" y="190" text-anchor="middle" font-size="28">③ gray 验证</text><text x="755" y="227" text-anchor="middle" font-size="23">部署该候选产物</text><rect x="930" y="150" width="225" height="100" rx="16" fill="#dcebc1" stroke="#292929" stroke-width="3"/><text x="1042" y="190" text-anchor="middle" font-size="28">④ 生产部署</text><text x="1042" y="227" text-anchor="middle" font-size="23">gray 通过后放行</text><path d="M285 200 H330" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M580 200 H625" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M875 200 H920" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M1042 250 V325" fill="none" stroke="#292929" stroke-width="3"  marker-end="url(#a)"/><path d="M1042 330 L1170 397 L1042 464 L914 397 Z" fill="#fff2aa" stroke="#292929" stroke-width="3"/><text x="1042" y="405" text-anchor="middle" font-size="24">运行正常？</text><rect x="370" y="350" width="410" height="100" rx="16" fill="#fffdf7" stroke="#292929" stroke-width="3"/><text x="575" y="390" text-anchor="middle" font-size="28">gray 不通过</text><text x="575" y="427" text-anchor="middle" font-size="23">修复分支 → 测试 → MR → 新 tag</text><path d="M755 250 V340" fill="none" stroke="#292929" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><path d="M1042 464 V535" fill="none" stroke="#292929" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="1090" y="500" text-anchor="middle" font-size="23">是</text><text x="1015" y="573" text-anchor="middle" font-size="25">完成并记录结果</text><rect x="360" y="525" width="450" height="100" rx="16" fill="#f4b66e" stroke="#292929" stroke-width="3"/><text x="585" y="565" text-anchor="middle" font-size="28">异常：恢复已知正常产物</text><text x="585" y="602" text-anchor="middle" font-size="23">先检查兼容性，再通过修复 MR 收口</text><path d="M914 397 H850 V575 H820" fill="none" stroke="#292929" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="875" y="424" text-anchor="middle" font-size="23">否</text></g></svg>