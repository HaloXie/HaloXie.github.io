</defs>
<rect width="1200" height="675" fill="#f8f7f1"/><rect width="1200" height="675" fill="url(#dots)"/>
<g font-family="Bradley Hand, Comic Sans MS, cursive" fill="#30312c">
<text x="56" y="58" font-size="22" font-weight="700" fill="#168c68">PROMPTWEAVE · DESIGN NOTE</text>
<text x="56" y="105" font-size="39" font-weight="700">Prompt 不只是文本</text>
<path d="M54 117 Q250 128 460 116" fill="none" stroke="#4aa6c2" stroke-width="9" opacity=".48" filter="url(#rough)"/>
<text x="58" y="145" font-size="20">先看一次“只改 Prompt”为什么会失控</text>
