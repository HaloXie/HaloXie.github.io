<text x="360" y="220" font-size="25" font-weight="700">设计推导</text>
<g stroke="#34352f" stroke-width="2.5" fill="#fffef8" filter="url(#rough)"><path d="M355 250 Q359 243 367 246 L522 246 Q530 249 528 258 L526 315 Q524 324 516 322 L365 323 Q356 320 358 312Z" fill="#c4e2e9"/><path d="M588 250 Q592 243 600 246 L753 246 Q761 249 759 258 L757 315 Q755 324 747 322 L598 323 Q589 320 591 312Z" fill="#dfebbd"/><path d="M820 250 Q824 243 832 246 L987 246 Q995 249 993 258 L991 315 Q989 324 981 322 L830 323 Q821 320 823 312Z" fill="#f2d09f"/></g>
<g font-size="22" text-anchor="middle"><text x="442" y="283">Prompt</text><text x="442" y="307">版本</text><text x="674" y="283">模型</text><text x="674" y="307">配置</text><text x="906" y="283">路由</text><text x="906" y="307">规则</text></g>
<g fill="none" stroke="#34352f" stroke-width="3" marker-end="url(#arrow)"><path d="M535 285 Q555 275 580 285"/><path d="M765 285 Q788 275 812 285"/></g>
<text x="360" y="365" font-size="18" font-weight="700">单独改一项，会临时拼出一套新组合</text>
<path d="M360 378 Q585 389 815 378" fill="none" stroke="#d7674b" stroke-width="5"/>
<text x="360" y="425" font-size="23" font-weight="700">所以发布单位要变成：</text>
<g stroke="#34352f" stroke-width="2.5" fill="#fffef8" filter="url(#rough)"><path d="M360 447 Q364 439 373 442 L815 442 Q825 445 822 455 L820 505 Q817 514 808 512 L370 513 Q359 510 361 500Z" fill="#e2edc8"/></g>
<text x="590" y="481" font-size="25" text-anchor="middle" font-weight="700">完整环境快照</text><text x="590" y="503" font-size="17" text-anchor="middle">一起验证 · 一起发布 · 一起恢复</text>
<!-- right takeaway -->
<g filter="url(#rough)" stroke="#34352f" stroke-width="2.5" fill="#fffef8"><path d="M930 188 Q934 180 943 183 L1140 184 Q1149 187 1147 197 L1145 405 Q1142 414 1133 412 L939 413 Q928 410 930 400Z"/></g>
