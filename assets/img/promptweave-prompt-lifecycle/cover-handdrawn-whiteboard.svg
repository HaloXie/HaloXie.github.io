<g filter="url(#rough)" stroke="#34352f" stroke-width="2.5" fill="#fffef8"><path d="M53 194 Q57 185 68 188 L286 189 Q297 191 295 202 L293 391 Q290 402 280 400 L67 401 Q55 398 56 388Z"/></g>
