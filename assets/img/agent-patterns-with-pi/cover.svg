<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Agent 决策权从路由走向循环</title><desc id="desc">一条手绘阶梯从 Prompt、软路由、工具选择走向受约束循环，Pi 位于最小 Agent Loop 的闭环中。</desc><defs><filter id="w" x="-4%" y="-6%" width="108%" height="112%"><feTurbulence baseFrequency=".011" numOctaves="1" seed="31"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#292929"/></marker><style>.i{stroke:#292929;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.s{font-family:Arial Unicode MS;fill:#1d1d1d}.t{font-size:44px;font-weight:780}.h{font-size:24px;font-weight:700}.n{font-size:17px;fill:#444}</style></defs><rect width="1200" height="675" fill="#f6f0df"/><text x="600" y="73" text-anchor="middle" class="s t">Agent 不只一种形态</text><text x="600" y="109" text-anchor="middle" class="s n">每一级都多交出一种运行时决策权</text><g filter="url(#w)"><path d="M80 530 h230 v-92 h220 v-92 h220 v-92 h370" fill="none" class="i"/><rect x="88" y="445" width="205" height="82" rx="18" fill="#90c7dc" class="i"/><text x="190" y="495" text-anchor="middle" class="s h">PROMPT</text><rect x="318" y="353" width="205" height="82" rx="18" fill="#ffd36a" class="i"/><text x="420" y="403" text-anchor="middle" class="s h">ROUTING</text><rect x="548" y="261" width="205" height="82" rx="18" fill="#f4b66e" class="i"/><text x="650" y="311" text-anchor="middle" class="s h">TOOLS</text><rect x="778" y="169" width="330" height="174" rx="25" fill="#dcebc1" class="i"/><text x="943" y="211" text-anchor="middle" class="s h">AGENT LOOP</text><circle cx="943" cy="271" r="42" fill="#fffdf7" class="i"/><text x="943" y="280" text-anchor="middle" class="s h">Pi</text><path d="M943 229 C1035 228 1045 313 987 331 M943 229 C851 228 841 313 899 331" fill="none" class="i" marker-end="url(#a)"/><path d="M300 485 H310 M530 393 H540 M760 301 H770" class="i" marker-end="url(#a)"/><path d="M101 580 C352 623 848 623 1099 580" fill="none" class="i" opacity=".55"/></g><rect x="327" y="568" width="546" height="53" rx="14" fill="#fff2aa" class="i"/><text x="600" y="602" text-anchor="middle" class="s h">先做小循环，再增加协调层</text></svg>
