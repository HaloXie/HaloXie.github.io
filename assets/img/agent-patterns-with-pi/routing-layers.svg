<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">自动匹配存在于不同层</title><desc id="desc">模型可以匹配 Prompt、Skill、Tool 或 Agent；这些层解决不同问题，不能相互替代。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#292929"/></marker><style>.i{stroke:#292929;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.s{font-family:Arial Unicode MS;fill:#1d1d1d}.t{font-size:39px;font-weight:750}.h{font-size:25px;font-weight:700}.b{font-size:18px;font-weight:550}.n{font-size:16px;fill:#444}</style></defs><rect width="1200" height="675" fill="#f6f0df"/><text x="600" y="60" text-anchor="middle" class="s t">“自动匹配”可能发生在四个不同层</text><text x="600" y="95" text-anchor="middle" class="s b">选中一个 Tool，不等于自动获得 Skill、专业 Agent 和完整循环</text><rect x="60" y="150" width="210" height="355" rx="20" fill="#90c7dc" class="i"/><rect x="350" y="150" width="210" height="355" rx="20" fill="#ffd36a" class="i"/><rect x="640" y="150" width="210" height="355" rx="20" fill="#f4b66e" class="i"/><rect x="930" y="150" width="210" height="355" rx="20" fill="#dcebc1" class="i"/><g class="s"><text x="165" y="204" text-anchor="middle" class="h">PROMPT</text><text x="165" y="245" text-anchor="middle" class="b">用什么角色与指令？</text><path d="M105 292 h120 v120 H105z" fill="#fffdf7" class="i"/><path d="M125 320 h80 M125 350 h60 M125 380 h72" class="i"/><text x="165" y="464" text-anchor="middle" class="n">改变回答视角</text><text x="455" y="204" text-anchor="middle" class="h">SKILL</text><text x="455" y="245" text-anchor="middle" class="b">按什么过程做？</text><circle cx="407" cy="320" r="13" fill="#fffdf7" class="i"/><circle cx="455" cy="365" r="13" fill="#fffdf7" class="i"/><circle cx="503" cy="410" r="13" fill="#fffdf7" class="i"/><path d="M417 329 445 356 M465 374 493 401" class="i" marker-end="url(#a)"/><text x="455" y="464" text-anchor="middle" class="n">加载流程与规则</text><text x="745" y="204" text-anchor="middle" class="h">TOOL</text><text x="745" y="245" text-anchor="middle" class="b">调用什么动作？</text><rect x="686" y="302" width="52" height="52" rx="9" fill="#fffdf7" class="i"/><rect x="752" y="302" width="52" height="52" rx="9" fill="#fffdf7" class="i"/><rect x="719" y="370" width="52" height="52" rx="9" fill="#fffdf7" class="i"/><text x="745" y="464" text-anchor="middle" class="n">获得外部能力</text><text x="1035" y="204" text-anchor="middle" class="h">AGENT</text><text x="1035" y="245" text-anchor="middle" class="b">把目标交给谁？</text><circle cx="1035" cy="345" r="65" fill="#fffdf7" class="i"/><circle cx="1013" cy="332" r="8" fill="#292929"/><circle cx="1057" cy="332" r="8" fill="#292929"/><path d="M1009 368 Q1035 386 1061 368" fill="none" class="i"/><text x="1035" y="464" text-anchor="middle" class="n">委派状态与循环</text></g><path d="M282 327 H337 M572 327 H627 M862 327 H917" class="i" marker-end="url(#a)"/><rect x="222" y="555" width="756" height="63" rx="14" fill="#fff2aa" class="i"/><text x="600" y="594" text-anchor="middle" class="s h">先说清楚匹配对象，再讨论它是不是 Agent</text></svg>
