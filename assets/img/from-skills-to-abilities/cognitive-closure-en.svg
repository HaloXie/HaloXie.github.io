<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Ability Is a Cognitive Closure</title><desc id="desc">An Ability unifies entry, judgment, source routing, context, and validation into an auditable closure.</desc>
  <defs><filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="41" result="n"/><feBlend in="SourceGraphic" in2="n" mode="multiply"/></filter><filter id="wobble" x="-5%" y="-8%" width="110%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="1" seed="23" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#252525"/></marker><style>.ink{stroke:#252525;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#252525;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.sans{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#171717}.title{font-size:40px;font-weight:750}.sub{font-size:20px;font-weight:550;fill:#444}.label{font-size:22px;font-weight:700}.small{font-size:17px;font-weight:550}.tiny{font-size:15px;font-weight:500}</style></defs>
  <rect width="1200" height="675" fill="#f6f0df"/><rect width="1200" height="675" fill="#fffaf0" opacity=".2" filter="url(#paper)"/>
  <g class="sans"><text x="600" y="61" text-anchor="middle" class="title">Ability: An Auditable Cognitive Closure</text><text x="600" y="96" text-anchor="middle" class="sub">Build an entry, routing, context, and evidence chain for one class of judgment</text></g>
  <g filter="url(#wobble)">
    <g transform="translate(57 184)"><rect width="246" height="313" rx="18" fill="#fffdf7" class="ink"/><text x="123" y="41" text-anchor="middle" class="sans label">Authoritative Sources</text><g transform="translate(27 72)"><rect width="192" height="55" rx="10" fill="#90c7dc" class="thin"/><text x="96" y="35" text-anchor="middle" class="sans small">Rules / Redlines</text></g><g transform="translate(27 141)"><rect width="192" height="55" rx="10" fill="#cfb7df" class="thin"/><text x="96" y="35" text-anchor="middle" class="sans small">Knowledge / Lessons</text></g><g transform="translate(27 210)"><rect width="192" height="55" rx="10" fill="#ffd36a" class="thin"/><text x="96" y="35" text-anchor="middle" class="sans small">Checklist / Evidence</text></g></g>
    <path d="M311 340 H370" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g transform="translate(382 135)"><path d="M190 0 C294 0 375 84 375 190 C375 296 294 380 190 380 C86 380 5 296 5 190 C5 84 86 0 190 0Z" fill="#f4b66e" class="ink"/><circle cx="190" cy="190" r="73" fill="#fffdf7" class="ink"/><text x="190" y="185" text-anchor="middle" class="sans label">ABILITY</text><text x="190" y="211" text-anchor="middle" class="sans small">one concern</text><g transform="translate(118 26)"><rect width="144" height="54" rx="11" fill="#dcebc1" class="thin"/><text x="72" y="34" text-anchor="middle" class="sans small">Cognitive Entry</text></g><g transform="translate(232 100)"><rect width="144" height="54" rx="11" fill="#fff2aa" class="thin"/><text x="72" y="34" text-anchor="middle" class="sans small">Judgment Frame</text></g><g transform="translate(218 275)"><rect width="144" height="54" rx="11" fill="#90c7dc" class="thin"/><text x="72" y="34" text-anchor="middle" class="sans small">Validation Contract</text></g><g transform="translate(18 275)"><rect width="144" height="54" rx="11" fill="#cfb7df" class="thin"/><text x="72" y="34" text-anchor="middle" class="sans small">Contextualization</text></g><g transform="translate(4 100)"><rect width="144" height="54" rx="11" fill="#ffd36a" class="thin"/><text x="72" y="34" text-anchor="middle" class="sans small">source routing</text></g><path d="M190 82 V111 M260 145 232 164 M251 251 229 226 M129 251 151 226 M120 145 148 164" class="thin"/></g>
    <path d="M765 340 H824" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g transform="translate(836 184)"><rect width="307" height="313" rx="18" fill="#fffdf7" class="ink"/><text x="153" y="41" text-anchor="middle" class="sans label">Execute &amp; Validate</text><rect x="43" y="78" width="221" height="67" rx="12" fill="#90c7dc" class="thin"/><text x="153" y="119" text-anchor="middle" class="sans label">Skill / Agent Execution</text><path d="M153 153 V193" fill="none" class="ink" marker-end="url(#arrow)"/><rect x="43" y="203" width="221" height="67" rx="12" fill="#dcebc1" class="thin"/><text x="153" y="244" text-anchor="middle" class="sans label">Validation Gate</text><path d="M43 237 C9 231 7 113 38 111" fill="none" class="thin" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="153" y="296" text-anchor="middle" class="sans tiny">Failure → Block / Degrade / Trace Source</text></g>
  </g>
  <g class="sans"><rect x="210" y="571" width="780" height="64" rx="14" fill="#fff2aa" class="ink" filter="url(#wobble)"/><text x="600" y="597" text-anchor="middle" class="small">Cohesion does not mean one giant file</text><text x="600" y="622" text-anchor="middle" class="label">It gives one class of judgment clear ownership and a complete evidence chain</text></g>
</svg>
