<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">From Tool to Cognitive Architecture</title><desc id="desc">Tool enables action, Skill provides process, Ability provides judgment, and Cognitive Architecture coordinates them.</desc>
  <defs><filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="37" result="n"/><feBlend in="SourceGraphic" in2="n" mode="multiply"/></filter><filter id="wobble" x="-5%" y="-8%" width="110%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="1" seed="19" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#252525"/></marker><style>.ink{stroke:#252525;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#252525;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.sans{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#171717}.title{font-size:40px;font-weight:750}.sub{font-size:20px;font-weight:550;fill:#444}.label{font-size:23px;font-weight:700}.small{font-size:17px;font-weight:550}.tiny{font-size:15px;font-weight:500}.eng{font-size:20px;font-weight:750}</style></defs>
  <rect width="1200" height="675" fill="#f6f0df"/><rect width="1200" height="675" fill="#fffaf0" opacity=".2" filter="url(#paper)"/>
  <g class="sans"><text x="600" y="61" text-anchor="middle" class="title">Do Not Make Skills Bigger—Change the Abstraction Layer</text><text x="600" y="96" text-anchor="middle" class="sub">Each layer stabilizes what the previous layer can do</text></g>
  <g filter="url(#wobble)">
    <g transform="translate(71 377)"><path d="M0 0 h238 v157 H0z" fill="#90c7dc" class="ink"/><text x="119" y="41" text-anchor="middle" class="sans eng">TOOL</text><text x="119" y="76" text-anchor="middle" class="sans label">Can Invoke</text><path d="M66 97 h106 v31 H66z M91 86 h56 v12" fill="#fffdf7" class="thin"/><text x="119" y="181" text-anchor="middle" class="sans small">Gives AI hands</text></g>
    <g transform="translate(327 305)"><path d="M0 0 h238 v229 H0z" fill="#ffd36a" class="ink"/><text x="119" y="41" text-anchor="middle" class="sans eng">SKILL</text><text x="119" y="76" text-anchor="middle" class="sans label">Follows Process</text><path d="M52 102 h134 M52 129 h103 M52 156 h120 M52 183 h82" class="thin"/><circle cx="37" cy="102" r="7" fill="#fffdf7" class="thin"/><circle cx="37" cy="129" r="7" fill="#fffdf7" class="thin"/><circle cx="37" cy="156" r="7" fill="#fffdf7" class="thin"/><text x="119" y="253" text-anchor="middle" class="sans small">Gives AI steps</text></g>
    <g transform="translate(583 224)"><path d="M0 0 h238 v310 H0z" fill="#f4b66e" class="ink"/><text x="119" y="41" text-anchor="middle" class="sans eng">ABILITY</text><text x="119" y="76" text-anchor="middle" class="sans label">Judges Quality</text><path d="M119 103 C160 103 185 134 180 170 C176 202 151 222 119 244 C87 222 62 202 58 170 C53 134 78 103 119 103Z" fill="#fffdf7" class="thin"/><path d="M85 166 l24 24 48-60" fill="none" class="ink"/><text x="119" y="279" text-anchor="middle" class="sans tiny">Loadable · Verifiable · Degradable</text><text x="119" y="334" text-anchor="middle" class="sans small">Gives AI judgment</text></g>
    <g transform="translate(839 135)"><path d="M0 0 h290 v399 H0z" fill="#dcebc1" class="ink"/><text x="145" y="41" text-anchor="middle" class="sans eng">COGNITIVE</text><text x="145" y="68" text-anchor="middle" class="sans eng">ARCHITECTURE</text><text x="145" y="104" text-anchor="middle" class="sans label">Long-Term Coordination</text><circle cx="145" cy="217" r="55" fill="#fffdf7" class="ink"/><circle cx="70" cy="166" r="31" fill="#90c7dc" class="thin"/><circle cx="220" cy="166" r="31" fill="#ffd36a" class="thin"/><circle cx="70" cy="278" r="31" fill="#cfb7df" class="thin"/><circle cx="220" cy="278" r="31" fill="#f4b66e" class="thin"/><path d="M97 184 120 199 M193 184 170 199 M97 261 120 239 M193 261 170 239" class="thin"/><text x="145" y="225" text-anchor="middle" class="sans small">runtime</text><text x="70" y="172" text-anchor="middle" class="sans tiny">memory</text><text x="220" y="172" text-anchor="middle" class="sans tiny">ability</text><text x="70" y="284" text-anchor="middle" class="sans tiny">rules</text><text x="220" y="284" text-anchor="middle" class="sans tiny">tools</text><text x="145" y="348" text-anchor="middle" class="sans tiny">Isolation · Scheduling · Context Budget</text><text x="145" y="423" text-anchor="middle" class="sans small">Makes judgment systemic</text></g>
    <path d="M299 427 H318 M555 355 H574 M811 275 H830" fill="none" class="ink" marker-end="url(#arrow)"/>
  </g>
  <g class="sans"><rect x="206" y="579" width="788" height="58" rx="14" fill="#fff2aa" class="ink" filter="url(#wobble)"/><text x="600" y="615" text-anchor="middle" class="label">Action ≠ Process ≠ Judgment ≠ System Coordination</text></g>
</svg>
