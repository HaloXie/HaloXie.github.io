<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ACP 的核心是 runtime contract</title><desc id="desc">一个 Ability Package 声明身份、适用性、来源、判断、验证、平台投射和降级，让不同 Harness 加载同一认知能力包。</desc>
  <defs><filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".69" numOctaves="2" seed="45" result="n"/><feBlend in="SourceGraphic" in2="n" mode="multiply"/></filter><filter id="wobble" x="-5%" y="-8%" width="110%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="1" seed="29" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#252525"/></marker><style>.ink{stroke:#252525;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#252525;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.sans{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#171717}.title{font-size:40px;font-weight:750}.sub{font-size:20px;font-weight:550;fill:#444}.label{font-size:22px;font-weight:700}.small{font-size:17px;font-weight:550}.tiny{font-size:15px;font-weight:500}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:16px;font-weight:600}</style></defs>
  <rect width="1200" height="675" fill="#f6f0df"/><rect width="1200" height="675" fill="#fffaf0" opacity=".2" filter="url(#paper)"/>
  <g class="sans"><text x="600" y="61" text-anchor="middle" class="title">ACP 的核心不是 schema，而是 runtime contract</text><text x="600" y="96" text-anchor="middle" class="sub">目标：同一认知能力包可以被不同 Harness 加载、验证和降级</text></g>
  <g filter="url(#wobble)">
    <g transform="translate(57 163)"><rect width="236" height="353" rx="18" fill="#fffdf7" class="ink"/><text x="118" y="42" text-anchor="middle" class="sans label">不同 Harness</text><g transform="translate(26 75)"><rect width="184" height="62" rx="11" fill="#90c7dc" class="thin"/><text x="92" y="39" text-anchor="middle" class="sans label">Claude</text></g><g transform="translate(26 156)"><rect width="184" height="62" rx="11" fill="#f4b66e" class="thin"/><text x="92" y="39" text-anchor="middle" class="sans label">Codex</text></g><g transform="translate(26 237)"><rect width="184" height="62" rx="11" fill="#cfb7df" class="thin"/><text x="92" y="39" text-anchor="middle" class="sans label">Gemini / Others</text></g></g>
    <path d="M301 339 H366" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g transform="translate(378 132)"><path d="M0 0 h444 v414 H0z" fill="#fff2aa" class="ink"/><path d="M0 66 h444" class="thin"/><text x="222" y="42" text-anchor="middle" class="sans label">ABILITY PACKAGE</text><g class="sans small"><text x="39" y="99">identity / applicability</text><text x="39" y="142">context_budget / sources</text><text x="39" y="185">judgments / redlines</text><text x="39" y="228">validation / evidence</text><text x="39" y="271">projection / adapters</text><text x="39" y="314">degradation / fallback</text></g><path d="M25 113 H419 M25 156 H419 M25 199 H419 M25 242 H419 M25 285 H419 M25 328 H419" class="thin"/><rect x="30" y="347" width="384" height="43" rx="9" fill="#dcebc1" class="thin"/><text x="222" y="374" text-anchor="middle" class="sans small">单一 concern · 权威 source · 可审计 evidence</text></g>
    <path d="M830 339 H895" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g transform="translate(907 163)"><rect width="236" height="353" rx="18" fill="#fffdf7" class="ink"/><text x="118" y="42" text-anchor="middle" class="sans label">Runtime 必答</text><text x="118" y="92" text-anchor="middle" class="sans small">什么时候加载？</text><text x="118" y="138" text-anchor="middle" class="sans small">加载多少？</text><text x="118" y="184" text-anchor="middle" class="sans small">证据从哪里来？</text><text x="118" y="230" text-anchor="middle" class="sans small">怎么证明生效？</text><text x="118" y="276" text-anchor="middle" class="sans small">失败如何降级？</text><rect x="36" y="303" width="164" height="28" rx="8" fill="#ef8f78" class="thin"/><text x="118" y="323" text-anchor="middle" class="sans tiny">答不出 = 只是文件格式</text></g>
  </g>
  <g class="sans"><rect x="223" y="578" width="754" height="58" rx="14" fill="#fff2aa" class="ink" filter="url(#wobble)"/><text x="600" y="614" text-anchor="middle" class="label">MCP 互操作工具；ACP 设想互操作认知能力包</text></g>
</svg>
