<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <title>From Skills to Abilities</title><desc>AI capability evolves by changing the abstraction—not by growing one procedure.</desc>
  <style>.ink{stroke:#292722;stroke-width:3}.thin{stroke:#292722;stroke-width:2}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.title{font:700 38px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#292722}.sub{font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#5f5a50}.label{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#292722}.body{font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#38352f}.num{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#292722}</style>
  <rect width="1200" height="675" fill="#f6f0df"/><path d="M25 120 C280 109 875 126 1175 112" fill="none" stroke="#d9cfb8" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" class="title">From Skills to Abilities</text><text x="600" y="96" text-anchor="middle" class="sub">AI capability evolves by changing the abstraction—not by growing one procedure.</text>
  <g><rect x="58" y="180" width="253" height="330" rx="20" fill="#90c7dc" class="ink"/><circle cx="96" cy="218" r="19" fill="#fffdf7" class="thin"/><text x="96" y="225" text-anchor="middle" class="num">1</text><text x="184" y="238" text-anchor="middle" class="label">TOOL</text><text x="184" y="282" text-anchor="middle" class="body">External action</text></g><g><rect x="335" y="180" width="253" height="330" rx="20" fill="#f4b66e" class="ink"/><circle cx="373" cy="218" r="19" fill="#fffdf7" class="thin"/><text x="373" y="225" text-anchor="middle" class="num">2</text><text x="461" y="238" text-anchor="middle" class="label">SKILL</text><text x="461" y="282" text-anchor="middle" class="body">Repeatable process</text></g><g><rect x="612" y="180" width="253" height="330" rx="20" fill="#dcebc1" class="ink"/><circle cx="650" cy="218" r="19" fill="#fffdf7" class="thin"/><text x="650" y="225" text-anchor="middle" class="num">3</text><text x="738" y="238" text-anchor="middle" class="label">ABILITY</text><text x="738" y="282" text-anchor="middle" class="body">Stable judgment</text></g><g><rect x="889" y="180" width="253" height="330" rx="20" fill="#cfb7df" class="ink"/><circle cx="927" cy="218" r="19" fill="#fffdf7" class="thin"/><text x="927" y="225" text-anchor="middle" class="num">4</text><text x="1015" y="224" text-anchor="middle" class="label" style="font-size:18px">COGNITIVE</text><text x="1015" y="247" text-anchor="middle" class="label" style="font-size:18px">ARCHITECTURE</text><text x="1015" y="292" text-anchor="middle" class="body">Long-term coordination</text></g>
  <rect x="165" y="610" width="870" height="45" rx="13" fill="#fffdf7" class="ink"/><text x="600" y="639" text-anchor="middle" class="label">Tool → Skill → Ability → Cognitive Architecture</text>
</svg>
