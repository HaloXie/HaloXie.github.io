<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw 的四步工作流</title><desc id="desc">从聊天消息到 OpenClaw 接收，再到模型思考和本地工具执行，最后把结果汇报给你。</desc>
  <defs><filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="2" seed="21" result="n"/><feBlend in="SourceGraphic" in2="n" mode="multiply"/></filter><filter id="wobble" x="-5%" y="-8%" width="110%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="1" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#252525"/></marker><style>.ink{stroke:#252525;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#252525;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.sans{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#171717}.title{font-size:40px;font-weight:750}.sub{font-size:20px;font-weight:550;fill:#444}.label{font-size:23px;font-weight:700}.small{font-size:17px;font-weight:550}.num{font-size:27px;font-weight:800;fill:#fffdf7}</style></defs>
  <rect width="1200" height="675" fill="#f6f0df"/><rect width="1200" height="675" fill="#fffaf0" opacity=".2" filter="url(#paper)"/>
  <g class="sans"><text x="600" y="61" text-anchor="middle" class="title">OpenClaw 怎么工作？</text><text x="600" y="96" text-anchor="middle" class="sub">消息是入口，模型是大脑，本地工具才是真正动手的双手</text></g>
  <g filter="url(#wobble)">
    <path d="M63 163 H305 V486 H63Z" fill="#e7f3f8" class="ink"/><path d="M322 163 H1137 V486 H322Z" fill="#fffdf7" class="ink"/><text x="184" y="145" text-anchor="middle" class="sans label">你的手机</text><text x="729" y="145" text-anchor="middle" class="sans label">你的电脑 + 云端模型</text>
    <g transform="translate(100 226)"><circle cx="84" cy="37" r="28" fill="#90c7dc" class="ink"/><text x="84" y="46" text-anchor="middle" class="sans num">1</text><rect x="0" y="82" width="168" height="105" rx="16" fill="#fffdf7" class="ink"/><path d="M25 105 h116 v45 H67 l-22 18 5-18 H25z" fill="#90c7dc" class="thin"/><text x="84" y="218" text-anchor="middle" class="sans label">发出任务</text></g>
    <g transform="translate(370 226)"><circle cx="84" cy="37" r="28" fill="#ef765f" class="ink"/><text x="84" y="46" text-anchor="middle" class="sans num">2</text><rect x="0" y="82" width="168" height="105" rx="16" fill="#fff1e8" class="ink"/><path d="M43 104 C28 127 36 158 55 169 M125 104 C140 127 132 158 113 169 M62 111 C74 97 94 97 106 111 M59 129 h50 M64 146 h40" fill="none" class="thin"/><text x="84" y="218" text-anchor="middle" class="sans label">OpenClaw 接收</text></g>
    <g transform="translate(646 226)"><circle cx="84" cy="37" r="28" fill="#cfb7df" class="ink"/><text x="84" y="46" text-anchor="middle" class="sans num">3</text><rect x="0" y="82" width="168" height="105" rx="16" fill="#f4edf8" class="ink"/><path d="M35 143 C31 105 82 95 96 125 C129 108 147 134 133 162 H35Z" fill="#fffdf7" class="thin"/><text x="84" y="218" text-anchor="middle" class="sans label">AI 拆解任务</text></g>
    <g transform="translate(922 226)"><circle cx="84" cy="37" r="28" fill="#78ae55" class="ink"/><text x="84" y="46" text-anchor="middle" class="sans num">4</text><rect x="0" y="82" width="168" height="105" rx="16" fill="#eef6e3" class="ink"/><path d="M27 107 h51 v40 H27z M36 99 h33 v9 M99 104 l15 15-25 25-15-15z" fill="#fffdf7" class="thin"/><text x="84" y="218" text-anchor="middle" class="sans label">工具执行</text></g>
    <path d="M273 355 H361" fill="none" class="ink" marker-end="url(#arrow)"/><path d="M546 355 H637" fill="none" class="ink" marker-end="url(#arrow)"/><path d="M822 355 H913" fill="none" class="ink" marker-end="url(#arrow)"/>
    <path d="M1006 456 C999 526 820 540 600 540 C366 540 185 526 184 458" fill="none" class="ink" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="600" y="568" text-anchor="middle" class="sans label">结果原路汇报给你</text>
  </g>
  <g class="sans"><rect x="211" y="596" width="778" height="50" rx="13" fill="#fff2aa" class="ink" filter="url(#wobble)"/><text x="600" y="628" text-anchor="middle" class="label">OpenClaw 在本地运行，不等于所有数据都永不出网</text></g>
</svg>
