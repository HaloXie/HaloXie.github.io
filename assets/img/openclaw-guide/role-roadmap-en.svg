<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw Roadmaps for Three Roles</title><desc id="desc">Developers, product managers, and sourcing teams start differently but share one measurable loop.</desc>
  <defs><filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".67" numOctaves="2" seed="33" result="n"/><feBlend in="SourceGraphic" in2="n" mode="multiply"/></filter><filter id="wobble" x="-5%" y="-8%" width="110%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="1" seed="17" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#252525"/></marker><style>.ink{stroke:#252525;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#252525;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.sans{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#171717}.title{font-size:40px;font-weight:750}.sub{font-size:20px;font-weight:550;fill:#444}.label{font-size:22px;font-weight:700}.small{font-size:17px;font-weight:550}.tiny{font-size:15px;font-weight:500}</style></defs>
  <rect width="1200" height="675" fill="#f6f0df"/><rect width="1200" height="675" fill="#fffaf0" opacity=".2" filter="url(#paper)"/>
  <g class="sans"><text x="600" y="61" text-anchor="middle" class="title">Different roles, different entry points; one minimum loop</text><text x="600" y="96" text-anchor="middle" class="sub">Start by making one recurring task reliably save time</text></g>
  <g filter="url(#wobble)">
    <g transform="translate(72 142)"><rect width="246" height="96" rx="16" fill="#90c7dc" class="ink"/><text x="123" y="39" text-anchor="middle" class="sans label">Developer</text><text x="123" y="68" text-anchor="middle" class="sans small">Read architecture → build a Skill</text></g>
    <g transform="translate(72 288)"><rect width="246" height="96" rx="16" fill="#cfb7df" class="ink"/><text x="123" y="39" text-anchor="middle" class="sans label">Product Manager</text><text x="123" y="68" text-anchor="middle" class="sans small">Define boundaries → write SKILL.md</text></g>
    <g transform="translate(72 434)"><rect width="246" height="96" rx="16" fill="#f4b66e" class="ink"/><text x="123" y="39" text-anchor="middle" class="sans label">Sourcing / Sales</text><text x="123" y="68" text-anchor="middle" class="sans small">Find repetition → run a small pilot</text></g>
    <path d="M326 190 C380 190 389 224 425 280 M326 336 H408 M326 482 C380 482 389 448 425 392" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g transform="translate(424 188)"><rect width="706" height="342" rx="20" fill="#fffdf7" class="ink"/><g transform="translate(28 67)"><circle cx="56" cy="56" r="51" fill="#ef765f" class="ink"/><text x="56" y="48" text-anchor="middle" class="sans label">Find one</text><text x="56" y="75" text-anchor="middle" class="sans label">real pain</text></g><g transform="translate(194 67)"><circle cx="56" cy="56" r="51" fill="#ffd36a" class="ink"/><text x="56" y="48" text-anchor="middle" class="sans label">Complete</text><text x="56" y="75" text-anchor="middle" class="sans label">one task</text></g><g transform="translate(360 67)"><circle cx="56" cy="56" r="51" fill="#90c7dc" class="ink"/><text x="56" y="48" text-anchor="middle" class="sans label">Record</text><text x="56" y="75" text-anchor="middle" class="sans label">time cost</text></g><g transform="translate(526 67)"><circle cx="56" cy="56" r="51" fill="#dcebc1" class="ink"/><text x="56" y="48" text-anchor="middle" class="sans label">Review, then</text><text x="56" y="75" text-anchor="middle" class="sans label">expand</text></g>
      <path d="M143 123 H187 M309 123 H353 M475 123 H519" fill="none" class="ink" marker-end="url(#arrow)"/>
      <path d="M610 186 C611 261 470 280 333 280 C184 280 56 260 56 186" fill="none" class="ink" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
      <text x="353" y="247" text-anchor="middle" class="sans label">Minimum loop: reproducible, measurable, stoppable</text><text x="353" y="294" text-anchor="middle" class="sans small">Solve one more problem each week; do not build everything at once</text>
    </g>
  </g>
  <g class="sans"><rect x="223" y="574" width="754" height="62" rx="14" fill="#fff2aa" class="ink" filter="url(#wobble)"/><text x="600" y="600" text-anchor="middle" class="small">OpenClaw does not create value automatically</text><text x="600" y="624" text-anchor="middle" class="label">Value = real problem × clear constraints × measurable result</text></g>
</svg>
