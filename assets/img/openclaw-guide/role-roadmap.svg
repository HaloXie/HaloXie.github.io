<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">三类角色的 OpenClaw 上手路线</title><desc id="desc">程序员、产品经理和采销从不同入口出发，但都应先选择一个真实痛点，跑通一个闭环并量化收益。</desc>
  <defs><filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".67" numOctaves="2" seed="33" result="n"/><feBlend in="SourceGraphic" in2="n" mode="multiply"/></filter><filter id="wobble" x="-5%" y="-8%" width="110%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="1" seed="17" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#252525"/></marker><style>.ink{stroke:#252525;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#252525;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.sans{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#171717}.title{font-size:40px;font-weight:750}.sub{font-size:20px;font-weight:550;fill:#444}.label{font-size:22px;font-weight:700}.small{font-size:17px;font-weight:550}.tiny{font-size:15px;font-weight:500}</style></defs>
  <rect width="1200" height="675" fill="#f6f0df"/><rect width="1200" height="675" fill="#fffaf0" opacity=".2" filter="url(#paper)"/>
  <g class="sans"><text x="600" y="61" text-anchor="middle" class="title">不同角色，不同入口；同一个最小闭环</text><text x="600" y="96" text-anchor="middle" class="sub">别先搭“完整 AI 团队”，先让一个重复任务稳定省下时间</text></g>
  <g filter="url(#wobble)">
    <g transform="translate(72 142)"><rect width="246" height="96" rx="16" fill="#90c7dc" class="ink"/><text x="123" y="39" text-anchor="middle" class="sans label">程序员</text><text x="123" y="68" text-anchor="middle" class="sans small">读架构 → 做第一个 Skill</text></g>
    <g transform="translate(72 288)"><rect width="246" height="96" rx="16" fill="#cfb7df" class="ink"/><text x="123" y="39" text-anchor="middle" class="sans label">产品经理</text><text x="123" y="68" text-anchor="middle" class="sans small">定义边界 → 写 SKILL.md</text></g>
    <g transform="translate(72 434)"><rect width="246" height="96" rx="16" fill="#f4b66e" class="ink"/><text x="123" y="39" text-anchor="middle" class="sans label">采销 / 供应链</text><text x="123" y="68" text-anchor="middle" class="sans small">找重复劳动 → 小范围试跑</text></g>
    <path d="M326 190 C380 190 389 224 425 280 M326 336 H408 M326 482 C380 482 389 448 425 392" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g transform="translate(424 188)"><rect width="706" height="342" rx="20" fill="#fffdf7" class="ink"/><g transform="translate(28 67)"><circle cx="56" cy="56" r="51" fill="#ef765f" class="ink"/><text x="56" y="48" text-anchor="middle" class="sans label">找一个</text><text x="56" y="75" text-anchor="middle" class="sans label">真痛点</text></g><g transform="translate(194 67)"><circle cx="56" cy="56" r="51" fill="#ffd36a" class="ink"/><text x="56" y="48" text-anchor="middle" class="sans label">跑通</text><text x="56" y="75" text-anchor="middle" class="sans label">一项任务</text></g><g transform="translate(360 67)"><circle cx="56" cy="56" r="51" fill="#90c7dc" class="ink"/><text x="56" y="48" text-anchor="middle" class="sans label">记录</text><text x="56" y="75" text-anchor="middle" class="sans label">时间成本</text></g><g transform="translate(526 67)"><circle cx="56" cy="56" r="51" fill="#dcebc1" class="ink"/><text x="56" y="48" text-anchor="middle" class="sans label">复盘后</text><text x="56" y="75" text-anchor="middle" class="sans label">再扩展</text></g>
      <path d="M143 123 H187 M309 123 H353 M475 123 H519" fill="none" class="ink" marker-end="url(#arrow)"/>
      <path d="M610 186 C611 261 470 280 333 280 C184 280 56 260 56 186" fill="none" class="ink" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
      <text x="353" y="247" text-anchor="middle" class="sans label">最小闭环：能复现、能量化、能停止</text><text x="353" y="294" text-anchor="middle" class="sans small">每周只多解决一个问题，不追求一次搭完</text>
    </g>
  </g>
  <g class="sans"><rect x="223" y="574" width="754" height="62" rx="14" fill="#fff2aa" class="ink" filter="url(#wobble)"/><text x="600" y="600" text-anchor="middle" class="small">OpenClaw 不会自动创造价值</text><text x="600" y="624" text-anchor="middle" class="label">价值来自：真实问题 × 清晰约束 × 可量化结果</text></g>
</svg>
