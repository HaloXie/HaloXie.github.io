<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw 完全入门指南</title>
  <desc id="desc">手绘信息图：红色小龙虾代表 OpenClaw，把聊天入口、AI 大脑与本地工具连接起来。</desc>
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="18" result="n"/><feBlend in="SourceGraphic" in2="n" mode="multiply"/></filter>
    <filter id="wobble" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="1" seed="6" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#252525"/></marker>
    <style>
      .ink{stroke:#252525;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#252525;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.sans{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#171717}.title{font-size:43px;font-weight:750}.sub{font-size:21px;font-weight:550;fill:#444}.label{font-size:23px;font-weight:700}.small{font-size:17px;font-weight:550}.tiny{font-size:15px;font-weight:500}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#f6f0df"/><rect width="1200" height="675" fill="#fffaf0" opacity=".2" filter="url(#paper)"/>
  <g class="sans"><text x="600" y="61" text-anchor="middle" class="title">OpenClaw 完全入门指南</text><text x="600" y="96" text-anchor="middle" class="sub">从零开始认识这只会替你干活的「小龙虾」</text></g>
  <g filter="url(#wobble)">
    <rect x="65" y="131" width="1070" height="411" rx="18" fill="#fffdf7" class="ink"/>
    <g transform="translate(421 145)">
      <path d="M96 72 C79 29 106 0 143 30 C172 4 204 29 191 72 C233 87 238 131 208 151 C217 206 183 254 143 273 C102 254 70 206 79 151 C48 131 54 87 96 72Z" fill="#ef765f" class="ink"/>
