    </g>
    <g transform="translate(105 216)"><rect width="236" height="119" rx="18" fill="#90c7dc" class="ink"/><path d="M33 25 h170 v50 H74 l-27 22 7-22 H33z" fill="#fffdf7" class="thin"/><path d="M63 43 h107 M63 58 h76" class="thin"/><text x="118" y="107" text-anchor="middle" class="sans label">聊天入口</text></g>
    <path d="M347 276 H413" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g transform="translate(858 183)"><rect width="224" height="96" rx="17" fill="#cfb7df" class="ink"/><path d="M47 55 C39 21 91 11 104 40 C130 24 156 42 151 68 H47Z" fill="#fffdf7" class="thin"/><text x="177" y="59" text-anchor="middle" class="sans label">AI 大脑</text></g>
