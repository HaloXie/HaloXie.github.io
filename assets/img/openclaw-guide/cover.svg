      <path d="M205 112 C243 85 271 105 267 137 C291 134 301 161 281 176 C261 191 230 176 223 151" fill="#ef765f" class="ink"/>
      <circle cx="117" cy="78" r="11" fill="#fffdf7" class="ink"/><circle cx="169" cy="78" r="11" fill="#fffdf7" class="ink"/><circle cx="119" cy="80" r="4" fill="#252525"/><circle cx="167" cy="80" r="4" fill="#252525"/>
      <path d="M122 113 C135 124 151 124 164 113 M103 155 H183 M96 184 H190 M106 216 H180" fill="none" class="thin"/>
      <path d="M82 243 C50 254 37 276 30 302 M204 243 C236 254 249 276 256 302" fill="none" class="ink"/>
