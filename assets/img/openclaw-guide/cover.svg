  </g>
  <g class="sans"><rect x="190" y="568" width="820" height="67" rx="14" fill="#fff2aa" class="ink" filter="url(#wobble)"/><text x="600" y="595" text-anchor="middle" class="small">你在手机上发一句话</text><text x="600" y="620" text-anchor="middle" class="label">它在你的电脑上拆任务、调工具、给结果</text></g>
