<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">安装 Skill 前先过四道安全门</title><desc id="desc">ClawHub 的 Skill 在接触本地文件和凭证前，应检查来源、源码、权限以及公网暴露。</desc>
  <defs><filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="27" result="n"/><feBlend in="SourceGraphic" in2="n" mode="multiply"/></filter><filter id="wobble" x="-5%" y="-8%" width="110%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="1" seed="14" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#252525"/></marker><style>.ink{stroke:#252525;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#252525;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.sans{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#171717}.title{font-size:40px;font-weight:750}.sub{font-size:20px;font-weight:550;fill:#444}.label{font-size:23px;font-weight:700}.small{font-size:17px;font-weight:550}.tiny{font-size:15px;font-weight:500}</style></defs>
  <rect width="1200" height="675" fill="#f6f0df"/><rect width="1200" height="675" fill="#fffaf0" opacity=".2" filter="url(#paper)"/>
  <g class="sans"><text x="600" y="61" text-anchor="middle" class="title">Skill 不是“装了就信”，而是“过门再用”</text><text x="600" y="96" text-anchor="middle" class="sub">它拿到的是 AI 的执行能力，也可能碰到你的文件、浏览器和凭证</text></g>
  <g filter="url(#wobble)">
    <g transform="translate(72 165)"><rect width="242" height="323" rx="17" fill="#fffdf7" class="ink"/><text x="121" y="41" text-anchor="middle" class="sans label">ClawHub</text><g transform="translate(28 69)"><rect width="186" height="58" rx="10" fill="#90c7dc" class="thin"/><text x="93" y="36" text-anchor="middle" class="sans small">报表 Skill</text></g><g transform="translate(28 142)"><rect width="186" height="58" rx="10" fill="#f4b66e" class="thin"/><text x="93" y="36" text-anchor="middle" class="sans small">翻译 Skill</text></g><g transform="translate(28 215)"><rect width="186" height="58" rx="10" fill="#ef8f78" class="thin"/><text x="93" y="36" text-anchor="middle" class="sans small">未知 Skill ?</text></g></g>
    <path d="M322 325 H379" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g transform="translate(391 137)"><path d="M0 0 h389 v380 H0z" fill="#fff2aa" class="ink"/><path d="M0 76 h389 M0 152 h389 M0 228 h389 M0 304 h389" class="thin"/><text x="194" y="48" text-anchor="middle" class="sans label">① 来源可信</text><text x="194" y="124" text-anchor="middle" class="sans label">② 看源码与评价</text><text x="194" y="200" text-anchor="middle" class="sans label">③ 最小权限</text><text x="194" y="276" text-anchor="middle" class="sans label">④ 不暴露公网</text><text x="194" y="352" text-anchor="middle" class="sans small">异常结果 → 立即停用并检查</text></g>
    <path d="M787 325 H844" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g transform="translate(858 171)"><path d="M114 0 C166 34 198 43 228 48 V151 C228 224 174 276 114 304 C54 276 0 224 0 151 V48 C30 43 62 34 114 0Z" fill="#dcebc1" class="ink"/><path d="M70 139 l30 31 61-78" fill="none" stroke="#476b2b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="254" text-anchor="middle" class="sans label">可控地使用</text></g>
    <path d="M420 507 C387 551 319 545 269 506" fill="none" class="ink" stroke="#c94f3d" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="235" y="543" text-anchor="middle" class="sans small" fill="#b84634">未通过：不安装</text>
  </g>
  <g class="sans"><rect x="213" y="581" width="774" height="57" rx="14" fill="#f4b66e" class="ink" filter="url(#wobble)"/><text x="600" y="617" text-anchor="middle" class="label">高权限 Skill = 把家门钥匙交给一个会自动行动的陌生人</text></g>
</svg>
