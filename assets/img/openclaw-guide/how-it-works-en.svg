<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw’s Four-Step Workflow</title><desc id="desc">From a chat message to model reasoning, local tool execution, and the final report.</desc>
  <defs><filter id="wobble" x="-5%" y="-8%" width="110%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="1" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#252525"/></marker><style>.ink{stroke:#252525;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#252525;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.sans{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#171717}.title{font-size:40px;font-weight:750}.sub{font-size:20px;font-weight:550;fill:#444}.label{font-size:23px;font-weight:700}.small{font-size:17px;font-weight:550}.num{font-size:27px;font-weight:800;fill:#ffffff}</style></defs>
  <rect width="1200" height="675" fill="#fff9e9"/>
  <g class="sans"><text x="600" y="61" text-anchor="middle" class="title">How Does OpenClaw Work?</text><text x="600" y="96" text-anchor="middle" class="sub">Messages are the entry, the model is the brain, and local tools do the work</text></g>
  <g filter="url(#wobble)">
    <path d="M63 163 H305 V486 H63Z" fill="#e6f6ff" class="ink"/><path d="M322 163 H1137 V486 H322Z" fill="#ffffff" class="ink"/><text x="184" y="145" text-anchor="middle" class="sans label">Your Phone</text><text x="729" y="145" text-anchor="middle" class="sans label">Your Computer + Cloud Model</text>
    <g transform="translate(100 226)"><circle cx="84" cy="37" r="28" fill="#79cef2" class="ink"/><text x="84" y="46" text-anchor="middle" class="sans num">1</text><rect x="0" y="82" width="168" height="105" rx="16" fill="#ffffff" class="ink"/><path d="M25 105 h116 v45 H67 l-22 18 5-18 H25z" fill="#79cef2" class="thin"/><text x="84" y="218" text-anchor="middle" class="sans label">Send Task</text></g>
    <g transform="translate(370 226)"><circle cx="84" cy="37" r="28" fill="#ffb366" class="ink"/><text x="84" y="46" text-anchor="middle" class="sans num">2</text><rect x="0" y="82" width="168" height="105" rx="16" fill="#fff0dc" class="ink"/><path d="M43 104 C28 127 36 158 55 169 M125 104 C140 127 132 158 113 169 M62 111 C74 97 94 97 106 111 M59 129 h50 M64 146 h40" fill="none" class="thin"/><text x="84" y="218" text-anchor="middle" class="sans label">OpenClaw Receives</text></g>
    <g transform="translate(646 226)"><circle cx="84" cy="37" r="28" fill="#ade6bd" class="ink"/><text x="84" y="46" text-anchor="middle" class="sans num">3</text><rect x="0" y="82" width="168" height="105" rx="16" fill="#e6f8ed" class="ink"/><path d="M35 143 C31 105 82 95 96 125 C129 108 147 134 133 162 H35Z" fill="#ffffff" class="thin"/><text x="84" y="218" text-anchor="middle" class="sans label">AI Plans</text></g>
    <g transform="translate(922 226)"><circle cx="84" cy="37" r="28" fill="#78ae55" class="ink"/><text x="84" y="46" text-anchor="middle" class="sans num">4</text><rect x="0" y="82" width="168" height="105" rx="16" fill="#e6f8ed" class="ink"/><path d="M27 107 h51 v40 H27z M36 99 h33 v9 M99 104 l15 15-25 25-15-15z" fill="#ffffff" class="thin"/><text x="84" y="218" text-anchor="middle" class="sans label">Tools Execute</text></g>
    <path d="M273 355 H361" fill="none" class="ink" marker-end="url(#arrow)"/><path d="M546 355 H637" fill="none" class="ink" marker-end="url(#arrow)"/><path d="M822 355 H913" fill="none" class="ink" marker-end="url(#arrow)"/>
    <path d="M1006 456 C999 526 820 540 600 540 C366 540 185 526 184 458" fill="none" class="ink" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="600" y="568" text-anchor="middle" class="sans label">Results return to you</text>
  </g>
  <g class="sans"><rect x="211" y="596" width="778" height="50" rx="13" fill="#fff0a5" class="ink" filter="url(#wobble)"/><text x="600" y="628" text-anchor="middle" class="label">Running OpenClaw locally does not mean all data always stays offline</text></g>
</svg>
