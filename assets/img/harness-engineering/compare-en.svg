<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <title>Bare LLM Calls vs Harness Engineering</title><desc>The same model behaves very differently with a production control layer.</desc>
  <style>.ink{stroke:#292722;stroke-width:3}.thin{stroke:#292722;stroke-width:2}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.title{font:700 38px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#292722}.sub{font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#5f5a50}.label{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#292722}.body{font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#38352f}.num{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#292722}</style>
  <rect width="1200" height="675" fill="#f6f0df"/><path d="M25 120 C280 109 875 126 1175 112" fill="none" stroke="#d9cfb8" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" class="title">Bare LLM Calls vs Harness Engineering</text><text x="600" y="96" text-anchor="middle" class="sub">The same model behaves very differently with a production control layer.</text>
  <g><rect x="58" y="180" width="530" height="330" rx="20" fill="#90c7dc" class="ink"/><circle cx="96" cy="218" r="19" fill="#fffdf7" class="thin"/><text x="96" y="225" text-anchor="middle" class="num">1</text><text x="323" y="238" text-anchor="middle" class="label">BARE LLM</text><text x="323" y="282" text-anchor="middle" class="body">Ad hoc tools</text><text x="323" y="316" text-anchor="middle" class="body">Session-only memory</text><text x="323" y="350" text-anchor="middle" class="body">No validation</text></g><g><rect x="612" y="180" width="530" height="330" rx="20" fill="#f4b66e" class="ink"/><circle cx="650" cy="218" r="19" fill="#fffdf7" class="thin"/><text x="650" y="225" text-anchor="middle" class="num">2</text><text x="877" y="238" text-anchor="middle" class="label">HARNESS</text><text x="877" y="282" text-anchor="middle" class="body">Tool lifecycle</text><text x="877" y="316" text-anchor="middle" class="body">Managed context</text><text x="877" y="350" text-anchor="middle" class="body">Validation gates</text></g>
  <rect x="165" y="610" width="870" height="45" rx="13" fill="#fffdf7" class="ink"/><text x="600" y="639" text-anchor="middle" class="label">A model is the engine; the Harness is the framework that controls it.</text>
</svg>
