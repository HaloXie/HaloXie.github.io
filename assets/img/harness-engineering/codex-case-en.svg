<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <title>OpenAI Codex Case Study</title><desc>A small team used Codex Agents to build a beta product from an empty repository.</desc>
  <style>.ink{stroke:#292722;stroke-width:3}.thin{stroke:#292722;stroke-width:2}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.title{font:700 38px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#292722}.sub{font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#5f5a50}.label{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#292722}.body{font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#38352f}.num{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#292722}</style>
  <rect width="1200" height="675" fill="#f6f0df"/><path d="M25 120 C280 109 875 126 1175 112" fill="none" stroke="#d9cfb8" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" class="title">OpenAI Codex Case Study</text><text x="600" y="96" text-anchor="middle" class="sub">A small team used Codex Agents to build a beta product from an empty repository.</text>
  <g><rect x="58" y="158" width="345" height="190" rx="20" fill="#90c7dc" class="ink"/><circle cx="96" cy="196" r="19" fill="#fffdf7" class="thin"/><text x="96" y="203" text-anchor="middle" class="num">1</text><text x="230" y="216" text-anchor="middle" class="label">ENGINEERS</text><text x="230" y="260" text-anchor="middle" class="body">3 → 7</text></g><g><rect x="427" y="158" width="345" height="190" rx="20" fill="#f4b66e" class="ink"/><circle cx="465" cy="196" r="19" fill="#fffdf7" class="thin"/><text x="465" y="203" text-anchor="middle" class="num">2</text><text x="599" y="216" text-anchor="middle" class="label">DURATION</text><text x="599" y="260" text-anchor="middle" class="body">5 months</text></g><g><rect x="796" y="158" width="345" height="190" rx="20" fill="#dcebc1" class="ink"/><circle cx="834" cy="196" r="19" fill="#fffdf7" class="thin"/><text x="834" y="203" text-anchor="middle" class="num">3</text><text x="968" y="216" text-anchor="middle" class="label">CODEBASE</text><text x="968" y="260" text-anchor="middle" class="body">~1,000,000 lines</text></g><g><rect x="58" y="368" width="345" height="190" rx="20" fill="#cfb7df" class="ink"/><circle cx="96" cy="406" r="19" fill="#fffdf7" class="thin"/><text x="96" y="413" text-anchor="middle" class="num">4</text><text x="230" y="426" text-anchor="middle" class="label">HANDWRITTEN</text><text x="230" y="470" text-anchor="middle" class="body">0 lines</text></g><g><rect x="427" y="368" width="345" height="190" rx="20" fill="#fff2aa" class="ink"/><circle cx="465" cy="406" r="19" fill="#fffdf7" class="thin"/><text x="465" y="413" text-anchor="middle" class="num">5</text><text x="599" y="426" text-anchor="middle" class="label">MERGED PRs</text><text x="599" y="470" text-anchor="middle" class="body">~1,500</text></g><g><rect x="796" y="368" width="345" height="190" rx="20" fill="#ef8f78" class="ink"/><circle cx="834" cy="406" r="19" fill="#fffdf7" class="thin"/><text x="834" y="413" text-anchor="middle" class="num">6</text><text x="968" y="426" text-anchor="middle" class="label">AGENT RUNS</text><text x="968" y="470" text-anchor="middle" class="body">Often 6+ hours</text></g>
  <rect x="165" y="610" width="870" height="45" rx="13" fill="#fffdf7" class="ink"/><text x="600" y="639" text-anchor="middle" class="label">Reported throughput: 3.5 PRs per engineer per day.</text>
</svg>
