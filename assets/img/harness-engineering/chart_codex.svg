<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff9e9"/><g fill="#252525" font-family="Arial, PingFang SC, sans-serif"><text x="600" y="65" text-anchor="middle" font-size="36" font-weight="700">OpenAI Codex 案例：报道中的指标</text><text x="600" y="105" text-anchor="middle" font-size="20">不同单位分别展示，不放在同一数轴比较。</text><rect x="55" y="150" width="340" height="165" rx="18" fill="#79cef2" stroke="#252525" stroke-width="3"/><text x="225" y="200" text-anchor="middle" font-size="23">团队人数</text><text x="225" y="258" text-anchor="middle" font-size="30" font-weight="700">3 → 7 人</text><rect x="430" y="150" width="340" height="165" rx="18" fill="#ffb366" stroke="#252525" stroke-width="3"/><text x="600" y="200" text-anchor="middle" font-size="23">报道周期</text><text x="600" y="258" text-anchor="middle" font-size="30" font-weight="700">5 个月</text><rect x="805" y="150" width="340" height="165" rx="18" fill="#ade6bd" stroke="#252525" stroke-width="3"/><text x="975" y="200" text-anchor="middle" font-size="23">代码规模</text><text x="975" y="258" text-anchor="middle" font-size="30" font-weight="700">约 100 万行</text><rect x="55" y="345" width="340" height="165" rx="18" fill="#ffdc67" stroke="#252525" stroke-width="3"/><text x="225" y="395" text-anchor="middle" font-size="23">合并 PR</text><text x="225" y="453" text-anchor="middle" font-size="30" font-weight="700">约 1,500 个</text><rect x="430" y="345" width="340" height="165" rx="18" fill="#79cef2" stroke="#252525" stroke-width="3"/><text x="600" y="395" text-anchor="middle" font-size="23">人均吞吐</text><text x="600" y="453" text-anchor="middle" font-size="23" font-weight="700">3.5 PR / 工程师 / 天</text><rect x="805" y="345" width="340" height="165" rx="18" fill="#ffb366" stroke="#252525" stroke-width="3"/><text x="975" y="395" text-anchor="middle" font-size="23">手写代码</text><text x="975" y="453" text-anchor="middle" font-size="30" font-weight="700">0 行</text><text x="600" y="595" text-anchor="middle" font-size="18">来源语境：正文引用的 OpenAI 案例（2026 年报道）。</text><text x="600" y="630" text-anchor="middle" font-size="18">单个项目的报道结果，不代表普遍生产率保证。</text></g></svg>
