<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff9e9"/><g fill="#252525" font-family="Arial, PingFang SC, sans-serif"><text x="600" y="65" text-anchor="middle" font-size="36" font-weight="700">OpenAI Codex case: reported metrics</text><text x="600" y="105" text-anchor="middle" font-size="20">Different units are shown separately, not compared on a shared scale.</text><rect x="55" y="150" width="340" height="165" rx="18" fill="#79cef2" stroke="#252525" stroke-width="3"/><text x="225" y="200" text-anchor="middle" font-size="23">Team size</text><text x="225" y="258" text-anchor="middle" font-size="30" font-weight="700">3 → 7 engineers</text><rect x="430" y="150" width="340" height="165" rx="18" fill="#ffb366" stroke="#252525" stroke-width="3"/><text x="600" y="200" text-anchor="middle" font-size="23">Reported duration</text><text x="600" y="258" text-anchor="middle" font-size="30" font-weight="700">5 months</text><rect x="805" y="150" width="340" height="165" rx="18" fill="#ade6bd" stroke="#252525" stroke-width="3"/><text x="975" y="200" text-anchor="middle" font-size="23">Codebase</text><text x="975" y="258" text-anchor="middle" font-size="30" font-weight="700">~1 million lines</text><rect x="55" y="345" width="340" height="165" rx="18" fill="#ffdc67" stroke="#252525" stroke-width="3"/><text x="225" y="395" text-anchor="middle" font-size="23">Merged PRs</text><text x="225" y="453" text-anchor="middle" font-size="30" font-weight="700">~1,500 PRs</text><rect x="430" y="345" width="340" height="165" rx="18" fill="#79cef2" stroke="#252525" stroke-width="3"/><text x="600" y="395" text-anchor="middle" font-size="23">Throughput</text><text x="600" y="453" text-anchor="middle" font-size="23" font-weight="700">3.5 PRs / engineer / day</text><rect x="805" y="345" width="340" height="165" rx="18" fill="#ffb366" stroke="#252525" stroke-width="3"/><text x="975" y="395" text-anchor="middle" font-size="23">Handwritten code</text><text x="975" y="453" text-anchor="middle" font-size="30" font-weight="700">0 lines</text><text x="600" y="595" text-anchor="middle" font-size="18">Source context: the OpenAI case discussed in the article (2026 report).</text><text x="600" y="630" text-anchor="middle" font-size="18">Reported outcomes from one project; not a general productivity guarantee.</text></g></svg>
