ass="axis">End Engineers</text><rect x="550" y="155" width="129" height="385" rx="5" fill="#dcebc1" stroke="#292722" stroke-width="2"/><text x="615" y="143" text-anchor="middle" class="value">100</text><text x="615" y="570" text-anchor="middle" class="axis">Code (10K lines)</text><rect x="752" y="482" width="129" height="58" rx="5" fill="#cfb7df" stroke="#292722" stroke-width="2"/><text x="817" y="470" text-anchor="middle" class="value">15</text><text x="817" y="570" text-anchor="middle" class="axis">Merged PRs (100)</text><rect x="954" y="527" width="129" height="13" rx="5" fill="#ef8f78" stroke="#292722" stroke-width="2"/><text x="1019" y="515" text-anchor="middle" class="value">3.5</text><text x="1019" y="570" text-anchor="middle" class="axis">PRs / Engineer / Day</text><text x="32" y="350" text-anchor="middle" transform="rotate(-90 32 350)" class="axis">Indexed value</text><rect x="155" y="607" width="890" height="44" rx="12" fill="#fffdf7" stroke="#292722" stroke-width="2"/><text x="600" y="636" text-anchor="middle" class="foot">Approximately 1 million lines and 1,500 merged PRs.</text></svg>
