<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <title>The Model Is a Commodity; the Harness Is the Moat</title><desc>Differentiation moves from interchangeable model choice to the control system around it.</desc>
  <style>.ink{stroke:#292722;stroke-width:3}.thin{stroke:#292722;stroke-width:2}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.title{font:700 38px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#292722}.sub{font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#5f5a50}.label{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#292722}.body{font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#38352f}.num{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#292722}</style>
  <rect width="1200" height="675" fill="#f6f0df"/><path d="M25 120 C280 109 875 126 1175 112" fill="none" stroke="#d9cfb8" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" class="title">The Model Is a Commodity; the Harness Is the Moat</text><text x="600" y="96" text-anchor="middle" class="sub">Differentiation moves from interchangeable model choice to the control system around it.</text>
  <g><rect x="58" y="180" width="345" height="330" rx="20" fill="#90c7dc" class="ink"/><circle cx="96" cy="218" r="19" fill="#fffdf7" class="thin"/><text x="96" y="225" text-anchor="middle" class="num">1</text><text x="230" y="238" text-anchor="middle" class="label">MODEL LAYER</text><text x="230" y="282" text-anchor="middle" class="body">GPT · Claude · Gemini · Llama</text><text x="230" y="316" text-anchor="middle" class="body">Replaceable engines</text></g><g><rect x="427" y="180" width="345" height="330" rx="20" fill="#f4b66e" class="ink"/><circle cx="465" cy="218" r="19" fill="#fffdf7" class="thin"/><text x="465" y="225" text-anchor="middle" class="num">2</text><text x="599" y="238" text-anchor="middle" class="label">HARNESS MOAT</text><text x="599" y="282" text-anchor="middle" class="body">State · Tools · Verification</text><text x="599" y="316" text-anchor="middle" class="body">Feedback · Orchestration</text></g><g><rect x="796" y="180" width="345" height="330" rx="20" fill="#dcebc1" class="ink"/><circle cx="834" cy="218" r="19" fill="#fffdf7" class="thin"/><text x="834" y="225" text-anchor="middle" class="num">3</text><text x="968" y="238" text-anchor="middle" class="label">EVIDENCE</text><text x="968" y="282" text-anchor="middle" class="body">52.8% → 66.5%</text><text x="968" y="316" text-anchor="middle" class="body">Same model; Harness only</text></g>
  <rect x="165" y="610" width="870" height="45" rx="13" fill="#fffdf7" class="ink"/><text x="600" y="639" text-anchor="middle" class="label">Competitive advantage is shifting from the model layer to the Harness layer.</text>
</svg>
