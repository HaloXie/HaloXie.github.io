<!-- Only the CDN-failure notice lives here; React owns Pagefind and the working dialog. -->
<script>
  document.documentElement.dataset.platform = /Mac|iPhone|iPad/.test(navigator.platform) ? 'mac' : 'other';
  document.addEventListener('DOMContentLoaded', () => {
    if (document.documentElement.dataset.searchUi === 'antd') return;
    const trigger = document.getElementById('search-trigger');
    const dialog = document.getElementById('command-search-dialog');
    const input = document.getElementById('search-input');
    input.disabled = true;
    document.getElementById('command-search-status').textContent = {% if include.lang == 'en' %}'Search could not load. Reload to retry; the site navigation remains available.'{% else %}'搜索组件未能加载，请刷新重试；仍可使用站点导航。'{% endif %};
    trigger.addEventListener('click', event => {event.stopImmediatePropagation();dialog.showModal();}, {capture:true});
    document.getElementById('search-cancel').addEventListener('click', event => {event.stopImmediatePropagation();dialog.close();}, {capture:true});
    dialog.addEventListener('close', () => trigger.focus());
  }, {once:true});
</script>
